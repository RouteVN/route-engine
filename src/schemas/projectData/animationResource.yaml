$schema: http://json-schema.org/draft-07/schema#
title: Animation Resource
description: Schema for Route Graphics animation resources authored in project data
type: object
required:
  - type
$defs:
  easing:
    type: string
    description: Easing function to use.
    enum:
      - linear
      - easeInQuad
      - easeOutQuad
      - easeInOutQuad
      - easeInCubic
      - easeOutCubic
      - easeInOutCubic
      - easeInQuart
      - easeOutQuart
      - easeInOutQuart
      - easeInQuint
      - easeOutQuint
      - easeInOutQuint
      - easeInSine
      - easeOutSine
      - easeInOutSine
      - easeInExpo
      - easeOutExpo
      - easeInOutExpo
      - easeInCirc
      - easeOutCirc
      - easeInOutCirc
      - easeInBack
      - easeOutBack
      - easeInOutBack
      - easeInBounce
      - easeOutBounce
      - easeInOutBounce
      - easeInElastic
      - easeOutElastic
      - easeInOutElastic
  keyframe:
    type: object
    required:
      - value
      - duration
    properties:
      startValue:
        type: number
        description: Optional starting value for this keyframe.
      value:
        type: number
        description: The target value for this keyframe.
      duration:
        type: number
        description: Duration to reach this value in milliseconds.
      delay:
        type: number
        minimum: 0
        description: Delay before this keyframe in milliseconds.
      easing:
        $ref: "#/$defs/easing"
      relative:
        type: boolean
        description: Whether the value is relative to the previous keyframe value.
        default: false
    additionalProperties: false
  tweenProperty:
    type: object
    description: Update-animation tween track. Route Graphics resolves an auto track from the element target state and rejects mixing auto with keyframes or initialValue.
    properties:
      initialValue:
        type: number
        description: Optional initial value before the first keyframe.
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/keyframe"
      auto:
        type: object
        required: [duration]
        properties:
          duration:
            type: number
            minimum: 0
          delay:
            type: number
            minimum: 0
          easing:
            $ref: "#/$defs/easing"
        additionalProperties: false
    oneOf:
      - required: [keyframes]
        not:
          required: [auto]
      - required: [auto]
        not:
          anyOf:
            - required: [initialValue]
            - required: [keyframes]
    additionalProperties: false
  keyframeTweenProperty:
    type: object
    description: Transition tween track. Route Graphics only accepts keyframe timing on transition surfaces and mask progress, not auto tracks.
    properties:
      initialValue:
        type: number
        description: Optional initial value before the first keyframe.
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/keyframe"
    required: [keyframes]
    additionalProperties: false
  updateTween:
    type: object
    properties:
      alpha:
        $ref: "#/$defs/tweenProperty"
      translateX:
        $ref: "#/$defs/tweenProperty"
      translateY:
        $ref: "#/$defs/tweenProperty"
      x:
        $ref: "#/$defs/tweenProperty"
      y:
        $ref: "#/$defs/tweenProperty"
      scaleX:
        $ref: "#/$defs/tweenProperty"
      scaleY:
        $ref: "#/$defs/tweenProperty"
      rotation:
        $ref: "#/$defs/tweenProperty"
    additionalProperties: false
    minProperties: 1
  transitionTween:
    type: object
    properties:
      translateX:
        $ref: "#/$defs/keyframeTweenProperty"
      translateY:
        $ref: "#/$defs/keyframeTweenProperty"
      alpha:
        $ref: "#/$defs/keyframeTweenProperty"
      scaleX:
        $ref: "#/$defs/keyframeTweenProperty"
      scaleY:
        $ref: "#/$defs/keyframeTweenProperty"
      rotation:
        $ref: "#/$defs/keyframeTweenProperty"
    additionalProperties: false
    minProperties: 1
  transitionSide:
    type: object
    required:
      - tween
    properties:
      tween:
        $ref: "#/$defs/transitionTween"
    additionalProperties: false
  maskProgress:
    $ref: "#/$defs/keyframeTweenProperty"
  compositeMaskItem:
    type: object
    required:
      - texture
    properties:
      texture:
        type: string
      channel:
        type: string
        enum: [red, green, blue, alpha]
      invert:
        type: boolean
    additionalProperties: false
  mask:
    type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum: [single, sequence, composite]
      texture:
        type: string
      textures:
        type: array
        minItems: 1
        items:
          type: string
      items:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/compositeMaskItem"
      combine:
        type: string
        enum: [max, min, multiply, add]
      channel:
        type: string
        enum: [red, green, blue, alpha]
      softness:
        type: number
      invert:
        type: boolean
      sample:
        type: string
      progress:
        $ref: "#/$defs/maskProgress"
    additionalProperties: false
    allOf:
      - if:
          properties:
            kind:
              const: single
        then:
          required:
            - texture
      - if:
          properties:
            kind:
              const: sequence
        then:
          required:
            - textures
      - if:
          properties:
            kind:
              const: composite
        then:
          required:
            - items
properties:
  name:
    type: string
    description: Display name for the animation
  type:
    type: string
    enum: [update, transition]
    description: Animation structure. Only `update` and `transition` are supported.
  complete:
    type: object
    properties:
      payload:
        type: object
    additionalProperties: true
  tween:
    $ref: "#/$defs/updateTween"
  prev:
    $ref: "#/$defs/transitionSide"
  next:
    $ref: "#/$defs/transitionSide"
  mask:
    description: Route Graphics plays single and sequence masks; the array form must not widen the object form to composite masks the renderer rejects.
    oneOf:
      - $ref: "#/$defs/mask"
      - type: array
        minItems: 1
        items:
          $ref: "#/$defs/mask"
        not:
          contains:
            required: [kind]
            properties:
              kind:
                const: composite
allOf:
  - if:
      properties:
        type:
          const: update
    then:
      required:
        - tween
      not:
        anyOf:
          - required: [prev]
          - required: [next]
          - required: [mask]
  - if:
      properties:
        type:
          const: transition
    then:
      not:
        required: [tween]
      anyOf:
        - required: [prev]
        - required: [next]
        - required: [mask]
additionalProperties: false
