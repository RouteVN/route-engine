$schema: http://json-schema.org/draft-07/schema#
title: Audio Animation Resource
description: Reusable BGM transition or retained-property update
type: object
required: [type]
$defs:
  easing:
    type: string
    enum:
      - linear
      - easeInQuad
      - easeOutQuad
      - easeInOutQuad
      - easeInCubic
      - easeOutCubic
      - easeInOutCubic
      - easeInQuart
      - easeOutQuart
      - easeInOutQuart
      - easeInQuint
      - easeOutQuint
      - easeInOutQuint
      - easeInSine
      - easeOutSine
      - easeInOutSine
      - easeInExpo
      - easeOutExpo
      - easeInOutExpo
      - easeInCirc
      - easeOutCirc
      - easeInOutCirc
      - easeInBack
      - easeOutBack
      - easeInOutBack
      - easeInBounce
      - easeOutBounce
      - easeInOutBounce
      - easeInElastic
      - easeOutElastic
      - easeInOutElastic
  fade:
    type: object
    required: [duration]
    properties:
      delay:
        type: number
        minimum: 0
        default: 0
      duration:
        type: number
        minimum: 0
      easing:
        $ref: "#/$defs/easing"
    additionalProperties: false
  transitionSide:
    type: object
    minProperties: 1
    properties:
      fade:
        $ref: "#/$defs/fade"
    additionalProperties: false
  keyframeValue:
    oneOf:
      - type: number
      - const: target
  keyframe:
    type: object
    required: [value, duration]
    properties:
      value:
        $ref: "#/$defs/keyframeValue"
      duration:
        type: number
        minimum: 0
      delay:
        type: number
        minimum: 0
        default: 0
      easing:
        $ref: "#/$defs/easing"
      relative:
        type: boolean
        default: false
    additionalProperties: false
  volumeKeyframe:
    allOf:
      - $ref: "#/$defs/keyframe"
      - if:
          properties:
            value:
              type: number
            relative:
              const: false
          required: [value]
        then:
          properties:
            value:
              minimum: 0
              maximum: 100
  panKeyframe:
    allOf:
      - $ref: "#/$defs/keyframe"
      - if:
          properties:
            value:
              type: number
            relative:
              const: false
          required: [value]
        then:
          properties:
            value:
              minimum: -1
              maximum: 1
  volumeTweenProperty:
    type: object
    required: [keyframes]
    properties:
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/volumeKeyframe"
    additionalProperties: false
  panTweenProperty:
    type: object
    required: [keyframes]
    properties:
      keyframes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/panKeyframe"
    additionalProperties: false
  updateTween:
    type: object
    minProperties: 1
    properties:
      volume:
        $ref: "#/$defs/volumeTweenProperty"
      pan:
        $ref: "#/$defs/panTweenProperty"
    additionalProperties: false
properties:
  name:
    type: string
  type:
    enum: [update, transition]
  tween:
    $ref: "#/$defs/updateTween"
  prev:
    $ref: "#/$defs/transitionSide"
  next:
    $ref: "#/$defs/transitionSide"
allOf:
  - if:
      properties:
        type:
          const: update
    then:
      required: [tween]
      not:
        anyOf:
          - required: [prev]
          - required: [next]
  - if:
      properties:
        type:
          const: transition
    then:
      anyOf:
        - required: [prev]
        - required: [next]
      not:
        required: [tween]
additionalProperties: false
