$schema: http://json-schema.org/draft-07/schema#
title: System State Schema
description: Schema for the Route Engine runtime system state
type: object

defs:
  readPointer:
    type: object
    description: Pointer to a specific authored line
    properties:
      sceneId:
        type: string
        description: Optional authored scene ID for the target section
      sectionId:
        type: string
        description: Section ID
      lineId:
        type: string
        description: Line ID
    required: [sectionId, lineId]
    additionalProperties: false

  accountViewedRegistry:
    type: object
    description: Registry of viewed content
    properties:
      sections:
        type: array
        items:
          type: object
          properties:
            sectionId:
              type: string
            lastLineId:
              type: [string, "null"]
          required: [sectionId]
          additionalProperties: false
      resources:
        type: array
        items:
          type: object
          properties:
            resourceId:
              type: [string, number]
          required: [resourceId]
          additionalProperties: false
    required: [sections, resources]
    additionalProperties: false

  rollbackCheckpoint:
    type: object
    properties:
      sectionId:
        type: string
      lineId:
        type: string
      rollbackPolicy:
        type: string
      returnable:
        type: boolean
        description: False when this checkpoint is an internal transient control-flow entry
      executedActions:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            payload:
              description: Action payload captured for rollback replay
          required: [type]
          additionalProperties: false
    required: [sectionId, lineId]
    additionalProperties: false

  rollbackState:
    type: object
    properties:
      timeline:
        type: array
        items:
          $ref: "#/defs/rollbackCheckpoint"
      currentIndex:
        type: integer
      isRestoring:
        type: boolean
      replayStartIndex:
        type: integer
      returnabilityVersion:
        type: integer
        minimum: 1
        description: Persisted migration marker for sparse rollback landing-point eligibility
    required: [timeline, currentIndex, isRestoring, replayStartIndex]
    additionalProperties: false

  nextLineConfig:
    type: object
    properties:
      manual:
        type: object
        properties:
          enabled:
            type: boolean
          requireLineCompleted:
            type: boolean
        additionalProperties: false
      auto:
        type: object
        properties:
          enabled:
            type: boolean
          trigger:
            type: string
            enum: [fromStart, fromComplete]
          delay:
            type: number
            minimum: 0
        additionalProperties: false
      applyMode:
        type: string
        enum: [singleLine, persistent]
    additionalProperties: false

  soundPlaybackCommand:
    type: object
    properties:
      commandId:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      operation:
        type: string
        enum: [play, pause, resume, stop, seek]
      positionMs:
        type: number
        minimum: 0
    required: [commandId, operation]
    additionalProperties: false
    allOf:
      - if:
          properties:
            operation:
              enum: [play, seek]
        then:
          required: [positionMs]
      - if:
          properties:
            operation:
              enum: [pause, resume, stop]
        then:
          not:
            required: [positionMs]

  channelPlaybackCommand:
    type: object
    properties:
      commandId:
        type: integer
        minimum: 0
        maximum: 9007199254740991
      operation:
        type: string
        enum: [pause, resume]
    required: [commandId, operation]
    additionalProperties: false

  musicRoomPlayer:
    type: object
    properties:
      trackId:
        type: [string, "null"]
      pageIndex:
        type: integer
        minimum: 0
      status:
        type: string
        enum: [stopped, playing, paused, ended]
      readiness:
        type: string
        enum: [idle, loading, ready, error]
      positionMs:
        type: number
        minimum: 0
      durationMs:
        type: [number, "null"]
        exclusiveMinimum: 0
      playback:
        oneOf:
          - type: "null"
          - $ref: "#/defs/soundPlaybackCommand"
      seekFallback:
        oneOf:
          - type: "null"
          - type: object
            properties:
              commandId:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              status:
                type: string
                enum: [stopped, playing, paused, ended]
              positionMs:
                type: number
                minimum: 0
            required: [commandId, status, positionMs]
            additionalProperties: false
      bgmPlayback:
        $ref: "#/defs/channelPlaybackCommand"
    required:
      [
        trackId,
        pageIndex,
        status,
        readiness,
        positionMs,
        durationMs,
        playback,
        seekFallback,
        bgmPlayback,
      ]
    additionalProperties: false
    oneOf:
      - properties:
          trackId:
            type: "null"
          status:
            const: stopped
          readiness:
            const: idle
          positionMs:
            const: 0
          durationMs:
            type: "null"
          playback:
            type: "null"
          seekFallback:
            type: "null"
      - properties:
          trackId:
            type: string
            minLength: 1
          readiness:
            enum: [loading, ready, error]
          playback:
            $ref: "#/defs/soundPlaybackCommand"

  saveSlotState:
    type: object
    properties:
      contexts:
        type: array
        minItems: 1
    required: [contexts]
    additionalProperties: false

  saveSlotEntry:
    type: object
    properties:
      formatVersion:
        type: integer
        minimum: 1
      slotId:
        type: [number, string]
      savedAt:
        type: integer
      image:
        type: [string, "null"]
      state:
        $ref: "#/defs/saveSlotState"
    required: [formatVersion, slotId, savedAt, state]
    additionalProperties: true

  sceneReplayReturnState:
    type: object
    properties:
      autoMode:
        type: boolean
      skipMode:
        type: boolean
      dialogueUIHidden:
        type: boolean
      nextLineConfig:
        $ref: "#/defs/nextLineConfig"
      overlayStack:
        type: array
        items:
          type: object
          properties:
            resourceId:
              type: string
          required: [resourceId]
          additionalProperties: false
      confirmDialog:
        type: [object, "null"]
        properties:
          resourceId:
            type: string
          confirmActions:
            type: object
          cancelActions:
            type: object
        required: [resourceId, confirmActions, cancelActions]
        additionalProperties: false
      formDrafts:
        type: object
        additionalProperties:
          type: object
          properties:
            values:
              type: object
              additionalProperties: true
            touched:
              type: object
              additionalProperties:
                type: boolean
            errors:
              type: object
              additionalProperties:
                type: string
            submitted:
              type: boolean
          required: [values, touched, errors, submitted]
          additionalProperties: false
      isLineCompleted:
        type: boolean
      isDialogueHistoryShowing:
        type: boolean
      pendingScreenTransition:
        $ref: "../presentationActions.yaml#/properties/screen"
    required:
      [
        autoMode,
        skipMode,
        dialogueUIHidden,
        nextLineConfig,
        overlayStack,
        confirmDialog,
        formDrafts,
        isLineCompleted,
      ]
    additionalProperties: false

  sceneReplayContext:
    type: object
    properties:
      replayId:
        type: string
        minLength: 1
      finishOnNextAdvance:
        type: boolean
      returnState:
        $ref: "#/defs/sceneReplayReturnState"
    required: [replayId, finishOnNextAdvance, returnState]
    additionalProperties: false

  contextState:
    type: object
    properties:
      kind:
        type: string
        enum: [story, sceneReplay]
      sceneReplay:
        $ref: "#/defs/sceneReplayContext"
      currentPointerMode:
        type: string
        enum: [read]
      pointers:
        type: object
        properties:
          read:
            $ref: "#/defs/readPointer"
        required: [read]
        additionalProperties: false
      configuration:
        $ref: "./configuration.yaml"
      views:
        type: array
        items:
          type: object
          additionalProperties: true
      bgm:
        type: object
        properties:
          resourceId:
            type: string
        additionalProperties: true
      variables:
        type: object
        additionalProperties: true
      runtime:
        type: object
        properties:
          saveLoadPagination:
            type: integer
            minimum: 1
          menuPage:
            type: string
          menuEntryPoint:
            type: string
        required: [saveLoadPagination, menuPage, menuEntryPoint]
        additionalProperties: false
      rollback:
        $ref: "#/defs/rollbackState"
    required:
      [
        currentPointerMode,
        pointers,
        configuration,
        views,
        bgm,
        variables,
        rollback,
      ]
    additionalProperties: false
    oneOf:
      - properties:
          kind:
            const: story
        not:
          required: [sceneReplay]
      - properties:
          kind:
            const: sceneReplay
        required: [kind, sceneReplay]

properties:
  projectData:
    $ref: "../projectData/projectData.yaml"

  global:
    type: object
    properties:
      pendingEffects:
        type: array
        items:
          $ref: "./effects.yaml"
      variables:
        type: object
        description: Device- and account-scoped variables
        additionalProperties: true
      saveSlots:
        type: object
        description: Save slots indexed by stringified slot ID
        additionalProperties:
          $ref: "#/defs/saveSlotEntry"
      dialogueUIHidden:
        type: boolean
      dialogueTextSpeed:
        type: number
      autoForwardDelay:
        type: number
        description: Minimum global auto mode delay in milliseconds before length-based reading time is added
      autoForwardSpeed:
        type: number
        exclusiveMinimum: 0
        description: Global auto mode reading-speed multiplier, where 1 is normal and 2 is twice as fast
      skipUnseenText:
        type: boolean
      skipTransitionsAndAnimations:
        type: boolean
      soundVolume:
        type: number
        minimum: 0
        maximum: 100
      musicVolume:
        type: number
        minimum: 0
        maximum: 100
      muteAll:
        type: boolean
      confirmDialog:
        type: [object, "null"]
        properties:
          resourceId:
            type: string
          confirmActions:
            type: object
          cancelActions:
            type: object
        required: [resourceId, confirmActions, cancelActions]
        additionalProperties: false
      formDrafts:
        type: object
        description: Transient active-form draft values keyed by form key
        additionalProperties:
          type: object
          properties:
            values:
              type: object
              additionalProperties: true
            touched:
              type: object
              additionalProperties:
                type: boolean
            errors:
              type: object
              additionalProperties:
                type: string
            submitted:
              type: boolean
          required: [values, touched, errors, submitted]
          additionalProperties: false
      autoMode:
        type: boolean
      skipMode:
        type: boolean
      nextLineConfig:
        $ref: "#/defs/nextLineConfig"
      accountViewedRegistry:
        $ref: "#/defs/accountViewedRegistry"
      imageGalleryNavigation:
        type: object
        description: Transient navigation state for the singleton image gallery
        properties:
          groupId:
            type: [string, "null"]
          variantId:
            type: [string, "null"]
          pageIndex:
            type: integer
            minimum: 0
        required: [groupId, variantId, pageIndex]
        additionalProperties: false
        oneOf:
          - properties:
              groupId:
                type: "null"
              variantId:
                type: "null"
          - properties:
              groupId:
                type: string
                minLength: 1
              variantId:
                type: string
                minLength: 1
      sceneReplayNavigation:
        type: object
        description: Transient pagination state for the singleton scene-replay catalog
        properties:
          pageIndex:
            type: integer
            minimum: 0
        required: [pageIndex]
        additionalProperties: false
      audioCommandId:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        description: Monotonic transient identity for renderer audio commands
      musicRoomPlayer:
        $ref: "#/defs/musicRoomPlayer"
      overlayStack:
        type: array
        items:
          type: object
          properties:
            resourceId:
              type: string
          required: [resourceId]
          additionalProperties: false
      pendingScreenTransition:
        $ref: "../presentationActions.yaml#/properties/screen"
      isLineCompleted:
        type: boolean
    required:
      [
        pendingEffects,
        variables,
        saveSlots,
        dialogueUIHidden,
        dialogueTextSpeed,
        autoForwardDelay,
        autoForwardSpeed,
        skipUnseenText,
        skipTransitionsAndAnimations,
        soundVolume,
        musicVolume,
        muteAll,
        confirmDialog,
        formDrafts,
        autoMode,
        skipMode,
        nextLineConfig,
        accountViewedRegistry,
        imageGalleryNavigation,
        sceneReplayNavigation,
        audioCommandId,
        musicRoomPlayer,
        overlayStack,
        isLineCompleted,
      ]
    additionalProperties: false

  contexts:
    type: array
    minItems: 1
    items:
      $ref: "#/defs/contextState"

required: [projectData, global, contexts]
additionalProperties: false
