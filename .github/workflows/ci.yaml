name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: Check changed-file formatting
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run format:changed

      - run: bun run test

  visual-test:
    name: VT (${{ matrix.id }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: async-stale-click
            item: robustness/async-stale-click.yaml
          - id: l10n-roundtrip
            item: robustness/l10n-layout-roundtrip.yaml
          - id: particle-texture
            item: robustness/particle-image-texture.yaml
          - id: playback-auto-authored
            item: robustness/playback-auto-authored-co-due.yaml
          - id: playback-from-start
            item: robustness/playback-from-start-manual-completion.yaml
          - id: playback-skip-authored
            item: robustness/playback-skip-authored-co-due.yaml
          - id: save-load-timers
            item: robustness/save-load-skip-timer-cleanup.yaml
          - id: settings-batch
            item: robustness/settings-runtime-batch.yaml
          - id: template-click
            item: robustness/visual-layout-template-click.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Capture and compare healthy VT scenario
        env:
          VT_CASE_ID: ${{ matrix.id }}
          VT_ITEM: ${{ matrix.item }}
        run: bun run vt:ci

      - name: Upload VT diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vt-${{ matrix.id }}-${{ github.run_number }}
          path: |
            .rettangoli/vt/metrics.json
            .rettangoli/vt/report.json
            .rettangoli/vt/_site/report.html
            .rettangoli/vt/_site/candidate/**/*.webp
            .rettangoli/vt/_site/diff/**/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
