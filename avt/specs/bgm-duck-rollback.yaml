title: Rolling back to a line restores its BGM duck
description: >
  Rolling back from later music to a line that ducked music to 30% of its
  channel volume of 80 brings the music back at that level.
durationMs: 3000
tones:
  theme.wav: { frequency: 400, amplitude: 0.5 }
  other.wav: { frequency: 600, amplitude: 0.5 }
projectData:
  screen: { width: 64, height: 36 }
  resources:
    sounds:
      theme: { fileId: theme.wav }
      other: { fileId: other.wav }
    audioEffects:
      duck:
        type: update
        tween:
          volume:
            keyframes:
              - { value: 30, duration: 300, easing: linear }
  story:
    initialSceneId: scene
    scenes:
      scene:
        initialSectionId: section
        sections:
          section:
            lines:
              - id: music
                actions:
                  bgm: { volume: 80, sounds: [{ id: main, resourceId: theme }] }
              - id: ducked
                actions:
                  bgm:
                    volume: 80
                    audioEffects: { resourceId: duck }
                    sounds: [{ id: main, resourceId: theme }]
              - id: other
                actions:
                  bgm: { volume: 50, sounds: [{ id: main, resourceId: other }] }
steps:
  - { at: 500, actions: { nextLine: {} }, lineId: ducked }
  - { at: 1300, actions: { nextLine: {} }, lineId: other }
  - at: 2000
    actions: { rollbackToLine: { sectionId: section, lineId: ducked } }
    lineId: ducked
expect:
  - { source: other.wav, at: 1600, volume: 50 }
  # 30% of 80.
  - { source: theme.wav, at: 2500, volume: 24 }
  - { source: other.wav, at: 2500, volume: 0 }
  # Never above 80 before the duck ends, and never above 24 after it, while
  # the other music plays, or after the ducked line returns. The duck ends
  # just after 800.
  - { source: theme.wav, from: 0, to: 800, maxVolume: 80 }
  - { source: theme.wav, from: 820, to: 3000, maxVolume: 24 }
  - { source: other.wav, from: 0, to: 3000, maxVolume: 50 }
