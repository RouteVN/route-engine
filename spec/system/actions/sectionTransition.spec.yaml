                  lines:
                    - id: "1"
                      actions:
                        choice:
                          resourceId: "choice-ui"
                          items: []
                section2:
                  lines:
                    - id: "10"
                      actions:
                        dialogue:
                          content:
                            - text: "after choice"
      contexts:
        - currentPointerMode: "read"
          pointers:
            read:
              sectionId: "section1"
              lineId: "1"
  - sectionId: "section2"
