        timeline:
          - sectionId: "section1"
            lineId: "1"
            rollbackPolicy: "free"
          - sectionId: "section2"
            lineId: "10"
            rollbackPolicy: "free"
---
case: choice section transition preserves playback modes and restarts skip timer
in:
  - state:
      global:
        isLineCompleted: true
        autoMode: true
        skipMode: true
        skipUnseenText: true
        nextLineConfig:
          manual:
            enabled: true
