---
case: dynamic object key resolves in the selected else fallback
in:
  - elements:
      - id: story
        type: container
        children: []
    animations: []
  - presentationState:
      choice:
        resourceId: choices
        items:
          - id: one
            text: One
    variables:
      selected: false
      key: resolved
      record: {}
    resources:
      layouts:
        choices:
          elements:
            - id: choice
              type: container
              data:
                $if variables.selected:
                  unused: true
                $else:
                  "${variables.key}":
                    value: 7
                  stamp: "${objectValues(variables.record)}"
out:
  elements:
    - id: story
      type: container
      children:
        - id: choice
          type: container
          data:
            resolved:
              value: 7
            stamp: []
  animations: []
---
case: dynamic object key resolves in the selected if fallback
in:
  - elements:
      - id: story
        type: container
        children: []
    animations: []
  - presentationState:
      choice:
        resourceId: choices
        items:
          - id: one
            text: One
    variables:
      selected: true
      key: resolved
      record: {}
    resources:
      layouts:
        choices:
          elements:
            - id: choice
              type: container
              data:
                $if variables.selected:
                  "${variables.key}":
                    value: 7
                  stamp: "${objectValues(variables.record)}"
                $else:
                  unused: true
out:
  elements:
    - id: story
      type: container
      children:
        - id: choice
          type: container
          data:
            resolved:
              value: 7
            stamp: []
  animations: []
