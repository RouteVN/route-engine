      body:
        fontId: "fontMain"
        colorId: "fg"
        fontSize: 24
        fontWeight: "400"
        fontStyle: "normal"
        lineHeight: 1.2
    fonts:
      fontMain:
        fileId: "Arial"
    colors:
      fg:
        hex: "#FFFFFF"
out:
  type: "text"
  content:
    - text: "Italic"
      textStyle:
        fontStyle: "italic"
    - text: "Underlined"
      textStyle:
        textDecoration: "underline"
    - text: "Accent"
      textStyle:
        fill: "#b45309"
  textStyle:
    fontFamily: "Arial"
    fontSize: 24
    fontWeight: "400"
    fontStyle: "normal"
    lineHeight: 1.2
    fill: "#FFFFFF"
