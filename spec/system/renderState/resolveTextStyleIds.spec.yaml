throws: 'Inline textStyle.strokeWidth is not allowed in text content runs at "children[0].content[1]"'
---
case: content run inline textStyle must be an object
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle: "bold"
  - {}
throws: 'Inline textStyle at "content[0]" must be an object'
---
case: content run inline textStyle cannot be null
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle: null
  - {}
throws: 'Inline textStyle at "content[0]" must be an object'
---
case: content run inline textStyle cannot be an array
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          - fontWeight: "bold"
  - {}
throws: 'Inline textStyle at "content[0]" must be an object'
---
case: content run inline fill must be an opaque hex color
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fill: "rgba(255, 0, 0, 0.5)"
  - {}
throws: 'Inline textStyle.fill at "content[0]" must resolve to a hex color'
---
case: content run inline fill rejects hex colors with alpha
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fill: "#ff000080"
  - {}
throws: 'Inline textStyle.fill at "content[0]" must resolve to a hex color'
---
case: content run inline fill rejects color names
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fill: "red"
  - {}
throws: 'Inline textStyle.fill at "content[0]" must resolve to a hex color'
---
case: content run inline fill rejects non-string values
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fill: 255
  - {}
throws: 'Inline textStyle.fill at "content[0]" must resolve to a hex color'
---
case: content run inline fontWeight rejects unknown keywords
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fontWeight: "heavy"
  - {}
throws: 'Inline textStyle.fontWeight at "content[0]" must be normal, bold, bolder, lighter, or a number from 1 to 1000'
---
case: content run inline fontWeight rejects numbers outside 1 to 1000
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fontWeight: 1001
  - {}
throws: 'Inline textStyle.fontWeight at "content[0]" must be normal, bold, bolder, lighter, or a number from 1 to 1000'
---
case: content run inline fontWeight rejects booleans
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fontWeight: true
  - {}
throws: 'Inline textStyle.fontWeight at "content[0]" must be normal, bold, bolder, lighter, or a number from 1 to 1000'
---
case: content run inline fontStyle rejects unknown values
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          fontStyle: "slanted"
  - {}
throws: 'Inline textStyle.fontStyle at "content[0]" must be normal, italic, or oblique'
---
case: content run inline textDecoration rejects unsupported values
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyle:
          textDecoration: "line-through"
  - {}
throws: 'Inline textStyle.textDecoration at "content[0]" must be none or underline'
---
case: content run textStyleId still reports a missing text style when inline textStyle is present
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyleId: "missing"
        textStyle:
          fontWeight: "bold"
  - textStyles: {}
throws: 'Text style "missing" not found'
---
case: content run textStyleId must resolve to a non-empty string when inline textStyle is present
in:
  - type: "text"
    content:
      - text: "Hello"
        textStyleId: ""
        textStyle:
          fontWeight: "bold"
  - textStyles: {}
throws: 'textStyleId at "content[0]" must resolve to a non-empty string'
