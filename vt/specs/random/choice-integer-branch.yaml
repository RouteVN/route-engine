---
title: Choice Random Integer Branch
description: A choice click deterministically generates an integer, selects a weighted action branch, and renders the matching destination.
specs:
  - the initial line shows one isolated random-integer button
  - clicking the button dispatches a uniform integer action through the real input path
  - the deterministic VT random source selects 17 from the inclusive 1 through 20 range
  - the conditional is authored before random to exercise canonical scheduling
  - the integer action still stores 17 before conditional reads randomNumber
  - a nested weighted random selects its first outcome actions
  - the selected weighted outcome renders the success destination
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 180
  - action: wait
    ms: 180
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
resources:
  variables:
    vtRandomUint32:
      type: number
      scope: context
      default: 16
      readonly: true
    randomNumber:
      type: number
      scope: context
      default: 0
  characters:
    narrator:
      name: Guide
  layouts:
    backgroundLayout:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: bg
    dialogueLayout:
      mode: adv
      elements:
        - id: dialogue-box
          type: rect
          x: 120
          y: 760
          width: 1680
          height: 220
          colorId: panel
        - id: dialogue-text
          type: text
          x: 160
          y: 825
          width: 1300
          content: ${dialogue.content[0].text}
          textStyleId: textMain
        - id: random-number-display
          type: text
          x: 1760
          y: 80
          anchorX: 1
          content: "Number: ${variables.randomNumber}"
          textStyleId: textMuted
    choiceLayout:
      elements:
        - id: generate-button
          type: rect
          x: 600
          y: 300
          width: 720
          height: 120
          colorId: button
          click:
            payload:
              actions:
                conditional:
                  branches:
                    - when:
                        gte:
                          - var: variables.randomNumber
                          - 15
                      actions:
                        random:
                          distribution:
                            type: weighted
                            outcomes:
                              - weight: 1
                                actions:
                                  jumpToLine:
                                    lineId: success
                              - weight: 1
                                actions:
                                  jumpToLine:
                                    lineId: failure
                    - actions:
                        jumpToLine:
                          lineId: failure
                random:
                  distribution:
                    type: integer
                    min: 1
                    max: 20
                  variableId: randomNumber
        - id: generate-label
          type: text
          x: 800
          y: 338
          content: ${choice.items[0].content}
          textStyleId: textMain
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    bg:
      hex: "#000000"
    panel:
      hex: "#4D4D4D"
    button:
      hex: "#737373"
    fg:
      hex: "#FFFFFF"
    fgMuted:
      hex: "#D9D9D9"
  textStyles:
    textMain:
      fontId: fontDefault
      colorId: fg
      fontSize: 36
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    textMuted:
      fontId: fontDefault
      colorId: fgMuted
      fontSize: 34
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: source
      sections:
        source:
          lines:
            - id: start
              actions:
                background:
                  resourceId: backgroundLayout
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Generate an integer from 1 through 20."
                  characterId: narrator
                choice:
                  resourceId: choiceLayout
                  items:
                    - id: generate
                      content: "Generate 1–20"
            - id: success
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Success: the lock opens."
                  characterId: narrator
            - id: failure
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Failure branch should not be visible."
                  characterId: narrator
