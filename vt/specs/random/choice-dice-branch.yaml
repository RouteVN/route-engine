---
title: Choice Dice Branch
description: A choice click deterministically rolls dice, stores the typed result, and renders the matching destination.
specs:
  - the initial line shows one isolated roll button
  - clicking the button dispatches a random dice action through the real input path
  - the deterministic VT random source rolls 15 and applies a modifier of 2
  - the nested conditional renders the success destination with score 17
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 180
  - action: wait
    ms: 180
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
resources:
  variables:
    vtRandomUint32:
      type: number
      scope: context
      default: 14
      readonly: true
    lockpickBonus:
      type: number
      scope: context
      default: 2
    lastRoll:
      type: number
      scope: context
      default: 0
  characters:
    narrator:
      name: Guide
  layouts:
    backgroundLayout:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: bg
    dialogueLayout:
      mode: adv
      elements:
        - id: dialogue-box
          type: rect
          x: 120
          y: 760
          width: 1680
          height: 220
          colorId: panel
        - id: dialogue-text
          type: text
          x: 160
          y: 825
          width: 1300
          content: ${dialogue.content[0].text}
          textStyleId: textMain
        - id: roll-display
          type: text
          x: 1760
          y: 80
          anchorX: 1
          content: "Roll: ${variables.lastRoll}"
          textStyleId: textMuted
    choiceLayout:
      elements:
        - id: roll-button
          type: rect
          x: 600
          y: 300
          width: 720
          height: 120
          colorId: button
          click:
            payload:
              actions:
                random:
                  distribution:
                    type: dice
                    sides: 20
                    modifier: "${variables.lockpickBonus}"
                  actions:
                    updateVariable:
                      id: storeRoll
                      operations:
                        - variableId: lastRoll
                          op: set
                          value: "_random.value"
                    conditional:
                      branches:
                        - when:
                            gte:
                              - var: _random.value
                              - 15
                          actions:
                            jumpToLine:
                              lineId: success
                        - actions:
                            jumpToLine:
                              lineId: failure
        - id: roll-label
          type: text
          x: 800
          y: 338
          content: ${choice.items[0].content}
          textStyleId: textMain
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    bg:
      hex: "#000000"
    panel:
      hex: "#4D4D4D"
    button:
      hex: "#737373"
    fg:
      hex: "#FFFFFF"
    fgMuted:
      hex: "#D9D9D9"
  textStyles:
    textMain:
      fontId: fontDefault
      colorId: fg
      fontSize: 36
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    textMuted:
      fontId: fontDefault
      colorId: fgMuted
      fontSize: 34
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: source
      sections:
        source:
          lines:
            - id: start
              actions:
                background:
                  resourceId: backgroundLayout
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Roll the lockpick check."
                  characterId: narrator
                choice:
                  resourceId: choiceLayout
                  items:
                    - id: roll
                      content: "Roll d20 + 2"
            - id: success
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Success: the lock opens."
                  characterId: narrator
            - id: failure
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Failure branch should not be visible."
                  characterId: narrator
