---
title: Scene Replay Lifecycle
description: Starts a replay through a catalog click, advances through its terminal line, and restores the caller.
specs:
  - catalog data is rendered from the sceneReplay projection
  - startSceneReplay enters a fresh context with initial variables
  - finishSceneReplay keeps the terminal line visible until the next advance
  - the terminal advance restores the caller layout and variables
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 260
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 410
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 410
  - action: wait
    ms: 150
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
resources:
  variables:
    replayValue:
      type: string
      scope: context
      default: caller
  images:
    memoryThumbnail:
      fileId: la3lka
      width: 100
      height: 100
  sceneReplay:
    pageSize: 4
    replays:
      - id: firstMeeting
        title: First Meeting
        thumbnailImageId: memoryThumbnail
        startSectionId: replay
        initialVariables:
          replayValue: isolated replay
  layouts:
    replayCatalog:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: background
        - id: heading
          type: text
          content: Scene Replay
          x: 960
          y: 180
          anchorX: 0.5
          textStyleId: title
        - id: replay-items
          type: container
          children:
            - $for replay in sceneReplay.pageReplays:
                - id: replay-item-${replay.replayId}
                  type: container
                  children:
                    - id: replay-${replay.replayId}
                      type: rect
                      x: 560
                      y: 380
                      width: 800
                      height: 280
                      colorId: button
                      click:
                        payload:
                          actions:
                            startSceneReplay:
                              replayId: "${replay.replayId}"
                    - id: replay-label-${replay.replayId}
                      type: text
                      content: "Play: ${replay.title}"
                      x: 960
                      y: 495
                      anchorX: 0.5
                      textStyleId: body
        - id: caller-value
          type: text
          content: "State: ${variables.replayValue}"
          x: 960
          y: 760
          anchorX: 0.5
          textStyleId: muted
    replayFirst:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: replayBackground
        - id: replay-value
          type: text
          content: "Inside: ${variables.replayValue}"
          x: 960
          y: 260
          anchorX: 0.5
          textStyleId: title
        - id: replay-next
          type: rect
          x: 560
          y: 720
          width: 800
          height: 200
          colorId: button
          click:
            payload:
              actions:
                nextLine: {}
        - id: replay-next-label
          type: text
          content: Continue
          x: 960
          y: 795
          anchorX: 0.5
          textStyleId: body
    replayTerminal:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: terminalBackground
        - id: terminal-title
          type: text
          content: Replay complete
          x: 960
          y: 260
          anchorX: 0.5
          textStyleId: title
        - id: replay-return
          type: rect
          x: 560
          y: 720
          width: 800
          height: 200
          colorId: button
          click:
            payload:
              actions:
                nextLine: {}
        - id: replay-return-label
          type: text
          content: Return
          x: 960
          y: 795
          anchorX: 0.5
          textStyleId: body
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    background:
      hex: "#101820"
    replayBackground:
      hex: "#14213D"
    terminalBackground:
      hex: "#2A1A3A"
    button:
      hex: "#4D5B73"
    foreground:
      hex: "#FFFFFF"
    foregroundMuted:
      hex: "#A6B0C3"
  textStyles:
    title:
      fontId: fontDefault
      colorId: foreground
      fontSize: 56
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    body:
      fontId: fontDefault
      colorId: foreground
      fontSize: 38
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    muted:
      fontId: fontDefault
      colorId: foregroundMuted
      fontSize: 30
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: caller
      sections:
        caller:
          lines:
            - id: caller
              actions:
                layout:
                  resourceId: replayCatalog
        replay:
          lines:
            - id: replayStart
              actions:
                layout:
                  resourceId: replayFirst
            - id: replayEnd
              actions:
                finishSceneReplay: {}
                layout:
                  resourceId: replayTerminal
