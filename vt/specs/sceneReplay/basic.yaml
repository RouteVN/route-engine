---
title: Scene Replay Unlock And Lifecycle
description: A normal-story finish marker unlocks its scene, which can then be replayed and exited through the rendered catalog.
specs:
  - normal-story finishSceneReplay unlocks the current catalog scene
  - catalog data exposes the unlocked scene and current activity
  - startSceneReplay enters a fresh context with initial variables
  - the replay finish marker exits on advance and restores caller variables
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 260
  - action: wait
    ms: 150
  - action: screenshot
  - action: click
    x: 480
    y: 410
  - action: wait
    ms: 150
  - action: click
    x: 480
    y: 410
  - action: wait
    ms: 150
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
resources:
  variables:
    replayValue:
      type: string
      scope: context
      default: caller
  images:
    memoryThumbnail:
      fileId: la3lka
      width: 100
      height: 100
  sceneReplay:
    pageSize: 4
    replays:
      - sceneId: main
        title: First Meeting
        thumbnailImageId: memoryThumbnail
        initialVariables:
          replayValue: isolated replay
  layouts:
    replayCatalog:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: background
        - id: heading
          type: text
          content: Scene Replay
          x: 960
          y: 180
          anchorX: 0.5
          textStyleId: title
        - id: replay-items
          type: container
          children:
            - $for replay in sceneReplay.pageReplays:
                - id: replay-item-${replay.sceneId}
                  type: container
                  children:
                    - id: replay-${replay.sceneId}
                      type: rect
                      x: 560
                      y: 380
                      width: 800
                      height: 280
                      colorId: button
                      click:
                        payload:
                          actions:
                            startSceneReplay:
                              sceneId: "${replay.sceneId}"
                    - id: replay-label-${replay.sceneId}
                      type: text
                      content: "Play: ${replay.title}"
                      x: 960
                      y: 495
                      anchorX: 0.5
                      textStyleId: body
        - id: replay-status
          type: text
          content: "Active: ${sceneReplay.isActive} / Locked: ${sceneReplay.pageReplays[0].locked}"
          x: 960
          y: 680
          anchorX: 0.5
          textStyleId: muted
        - id: replay-advance
          type: rect
          x: 560
          y: 720
          width: 800
          height: 200
          colorId: button
          click:
            payload:
              actions:
                nextLine: {}
        - id: replay-advance-label
          type: text
          content: Finish replay
          x: 960
          y: 795
          anchorX: 0.5
          textStyleId: body
        - id: caller-value
          type: text
          content: "State: ${variables.replayValue}"
          x: 960
          y: 980
          anchorX: 0.5
          textStyleId: muted
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    background:
      hex: "#101820"
    replayBackground:
      hex: "#14213D"
    terminalBackground:
      hex: "#2A1A3A"
    button:
      hex: "#4D5B73"
    foreground:
      hex: "#FFFFFF"
    foregroundMuted:
      hex: "#A6B0C3"
  textStyles:
    title:
      fontId: fontDefault
      colorId: foreground
      fontSize: 56
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    body:
      fontId: fontDefault
      colorId: foreground
      fontSize: 38
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    muted:
      fontId: fontDefault
      colorId: foregroundMuted
      fontSize: 30
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: caller
      sections:
        caller:
          lines:
            - id: caller
              actions:
                finishSceneReplay: {}
                layout:
                  resourceId: replayCatalog
