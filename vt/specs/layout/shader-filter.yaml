---
title: Layout Shader Filter
description: Inline shader filters on layout elements should survive Engine resource resolution and receive RouteGraphics' deterministic time clock. Grayscale is used because the filter behavior, not color rendering, is under test.
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
specs:
  - a conditional filter template should flatten onto its nested layout element
  - valid textStyle and textStyleId shader parameters should remain opaque to Engine resource resolution
  - time true should advance the shader through deterministic keyframes without an Engine animation
steps:
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 100
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 600
  - action: screenshot
---
screen:
  width: 960
  height: 540
  backgroundColor: "#000000"
resources:
  variables:
    shadingEnabled:
      type: boolean
      scope: context
      default: true
  colors:
    panel:
      hex: "#D9D9D9"
  layouts:
    shadedLayout:
      elements:
        - id: shaded-container
          type: container
          children:
            - id: shaded-panel
              type: rect
              x: 180
              y: 100
              width: 600
              height: 340
              colorId: panel
              filters:
                - $if variables.shadingEnabled:
                    - id: timed-shade
                      type: shader
                      time: true
                      parameters:
                        textStyle: 0.25
                        textStyleId: 0
                      source:
                        webgl:
                          fragment: |
                            precision mediump float;

                            in vec2 vTextureCoord;
                            out vec4 finalColor;

                            uniform sampler2D uTexture;
                            uniform float uTime;
                            uniform float uTextStyle;
                            uniform float uTextStyleId;

                            void main(void)
                            {
                                vec4 color = texture(uTexture, vTextureCoord);
                                float phase = smoothstep(0.2, 0.6, uTime);
                                float level = mix(1.0, uTextStyle + uTextStyleId, phase);
                                finalColor = vec4(color.rgb * level, color.a);
                            }
                        webgpu:
                          source: |
                            struct GlobalFilterUniforms {
                              uInputSize: vec4<f32>,
                              uInputPixel: vec4<f32>,
                              uInputClamp: vec4<f32>,
                              uOutputFrame: vec4<f32>,
                              uGlobalFrame: vec4<f32>,
                              uOutputTexture: vec4<f32>,
                            };

                            struct ShaderUniforms {
                              uProgress: f32,
                              uTime: f32,
                              uResolution: vec2<f32>,
                              uTextStyle: f32,
                              uTextStyleId: f32,
                            };

                            @group(0) @binding(0) var<uniform> gfu: GlobalFilterUniforms;
                            @group(0) @binding(1) var uTexture: texture_2d<f32>;
                            @group(0) @binding(2) var uSampler: sampler;
                            @group(1) @binding(0) var<uniform> shaderUniforms: ShaderUniforms;

                            struct VSOutput {
                              @builtin(position) position: vec4<f32>,
                              @location(0) uv: vec2<f32>,
                            };

                            @vertex
                            fn mainVertex(@location(0) aPosition: vec2<f32>) -> VSOutput
                            {
                              var position = aPosition * gfu.uOutputFrame.zw + gfu.uOutputFrame.xy;
                              position.x = position.x * (2.0 / gfu.uOutputTexture.x) - 1.0;
                              position.y =
                                position.y * (2.0 * gfu.uOutputTexture.z / gfu.uOutputTexture.y) -
                                gfu.uOutputTexture.z;
                              let uv = aPosition * (gfu.uOutputFrame.zw * gfu.uInputSize.zw);
                              return VSOutput(vec4<f32>(position, 0.0, 1.0), uv);
                            }

                            @fragment
                            fn mainFragment(@location(0) uv: vec2<f32>) -> @location(0) vec4<f32>
                            {
                              let color = textureSample(uTexture, uSampler, uv);
                              let phase = smoothstep(0.2, 0.6, shaderUniforms.uTime);
                              let level = mix(
                                1.0,
                                shaderUniforms.uTextStyle + shaderUniforms.uTextStyleId,
                                phase,
                              );
                              return vec4<f32>(color.rgb * level, color.a);
                            }
story:
  initialSceneId: scene1
  scenes:
    scene1:
      name: Shader Filter
      initialSectionId: section1
      sections:
        section1:
          name: Layout Shader Filter
          lines:
            - id: line1
              actions:
                layout:
                  resourceId: shadedLayout
