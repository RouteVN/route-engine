---
title: Layout Animation
description: Test action-selected layout animation resources in and out
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
specs:
  - layout animations should be selected from resources by the line action
  - a transition resource should animate the entering layout
  - an update resource should animate the persisted layout out
steps:
  - action: customEvent
    name: vt:nextLine
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 150
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 150
  - action: screenshot
  - action: customEvent
    name: vt:nextLine
  - action: customEvent
    name: vt:nextLine
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 200
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 200
  - action: screenshot
---
screen:
  width: 960
  height: 540
  backgroundColor: "#000000"
resources:
  controls:
    base1:
      elements:
        - id: af32
          type: rect
          width: 960
          height: 540
          alpha: 0.001
          click:
            payload:
              actions:
                nextLine: {}
          colorId: layoutColor1
  layouts:
    menuLayout:
      name: Menu Layout
      elements:
        - id: menu-container
          type: container
          x: 280
          y: 100
          children:
            - id: menu-bg
              type: rect
              width: 400
              height: 340
              colorId: layoutColor2
            - id: menu-title
              type: text
              content: Menu
              x: 150
              y: 40
              textStyleId: textStyle1
            - id: menu-item-1
              type: text
              content: Option 1
              x: 40
              y: 120
              textStyleId: textStyle2
            - id: menu-item-2
              type: text
              content: Option 2
              x: 40
              y: 180
              textStyleId: textStyle2
  animations:
    fadeOut:
      name: Fade Out
      type: update
      tween:
        alpha:
          initialValue: 1
          keyframes:
            - duration: 400
              value: 0
              easing: linear
    scaleIn:
      name: Scale In
      type: transition
      next:
        tween:
          scaleX:
            initialValue: 0.8
            keyframes:
              - duration: 300
                value: 1
                easing: linear
          scaleY:
            initialValue: 0.8
            keyframes:
              - duration: 300
                value: 1
                easing: linear
          alpha:
            initialValue: 0
            keyframes:
              - duration: 300
                value: 1
                easing: linear
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    color1:
      hex: "#FFFFFF"
    layoutColor1:
      hex: "#000000"
    layoutColor2:
      hex: "#4D4D4D"
  textStyles:
    textStyle1:
      fontId: fontDefault
      colorId: color1
      fontSize: 36
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    textStyle2:
      fontId: fontDefault
      colorId: color1
      fontSize: 24
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: scene1
  scenes:
    scene1:
      name: Scene 1
      initialSectionId: section1
      sections:
        section1:
          name: Section 1
          lines:
            - id: line1
              actions:
                control:
                  resourceId: base1
            - id: line2
              actions:
                layout:
                  resourceId: menuLayout
                  animations:
                    resourceId: scaleIn
            - id: line3
              actions:
                layout:
                  resourceId: menuLayout
            - id: line4
              actions:
                layout:
                  resourceId: menuLayout
                  animations:
                    resourceId: fadeOut
