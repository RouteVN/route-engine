---
title: Live Auto Setting Update
description: Changing global auto-forward timing while auto mode is running reschedules the active timer.
specs:
  - start auto mode with a 200 ms base delay
  - change the base delay to 1500 ms before it fires
  - the current line must remain active past the old delay
  - the current stale-global-timer bug reaches the red sentinel
skipInitialScreenshot: true
viewport:
  id: capture
  width: 1280
  height: 720
steps:
  - action: wait
    ms: 250
  - action: click
    x: 300
    y: 330
  - action: wait
    ms: 30
  - action: click
    x: 780
    y: 330
  - action: wait
    ms: 400
  - action: screenshot
---
screen:
  width: 1280
  height: 720
resources:
  controls:
    autoControl:
      elements:
        - id: background
          type: rect
          width: 1280
          height: 720
          colorId: background
        - id: updated-panel
          $when: variables.settingUpdated
          type: rect
          x: 60
          y: 60
          width: 1160
          height: 600
          colorId: success
        - id: title
          type: text
          x: 100
          y: 90
          content: "Update global auto delay while running"
          textStyleId: title
        - id: start-button
          type: rect
          x: 100
          y: 260
          width: 400
          height: 140
          colorId: action
          click:
            payload:
              actions:
                setAutoForwardDelay:
                  value: 200
                startAutoMode: {}
        - id: start-label
          type: text
          x: 170
          y: 308
          content: "1. Start at 200 ms"
          textStyleId: body
        - id: update-button
          type: rect
          x: 580
          y: 260
          width: 400
          height: 140
          colorId: action
          click:
            payload:
              actions:
                setAutoForwardDelay:
                  value: 1500
                updateVariable:
                  id: markSettingUpdated
                  operations:
                    - variableId: settingUpdated
                      op: set
                      value: true
        - id: update-label
          type: text
          x: 640
          y: 308
          content: "2. Extend to 1500 ms"
          textStyleId: body
        - id: expected-label
          $when: variables.settingUpdated
          type: text
          x: 150
          y: 500
          content: "EXPECTED: active timer uses 1500 ms"
          textStyleId: title
    sentinelControl:
      elements:
        - id: failure-panel
          type: rect
          width: 1280
          height: 720
          colorId: failure
        - id: failure-label
          type: text
          x: 120
          y: 220
          content: "BUG: old global auto timer advanced"
          textStyleId: title
  variables:
    settingUpdated:
      type: boolean
      scope: context
      default: false
  fonts:
    default:
      fileId: Arial
  colors:
    background:
      hex: "#111827"
    action:
      hex: "#2563EB"
    success:
      hex: "#166534"
    failure:
      hex: "#991B1B"
    text:
      hex: "#FFFFFF"
  textStyles:
    title:
      fontId: default
      colorId: text
      fontSize: 42
      lineHeight: 1.2
    body:
      fontId: default
      colorId: text
      fontSize: 29
      lineHeight: 1.3
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: auto
              actions:
                control:
                  resourceId: autoControl
            - id: sentinel
              actions:
                control:
                  resourceId: sentinelControl
