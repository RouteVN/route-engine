---
title: Variable Random Line Rollback
description: >-
  A line rolls a number and a weighted text value with updateVariable random
  operations. Back and Load show the recorded roll again without drawing, and
  entering the line again after rolling back past it draws a new roll.
specs:
  - the roll line stores 3 plus 10 in dice and the last weighted value in weather
  - advancing and pressing Back shows the same roll with no new draw
  - rolling back past the line restores the defaults, and entering it again draws a new roll
  - loading the save made after the first roll shows the first roll again with no new draw
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: main
      lineId: start
  - action: assert
    type: js
    global: __vtCheckpoint.textById.dice-value
    value: DICE 0
  - action: assert
    type: js
    global: __vtCheckpoint.textById.weather-value
    value: WEATHER none
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 0
  - action: screenshot
  - action: click
    x: 815
    "y": 475
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: main
      lineId: roll
  - action: assert
    type: js
    global: __vtCheckpoint.textById.dice-value
    value: DICE 13
  - action: assert
    type: js
    global: __vtCheckpoint.textById.weather-value
    value: WEATHER storm
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 3
  - action: screenshot
  - action: click
    x: 115
    "y": 475
  - action: wait
