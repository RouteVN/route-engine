    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: main
      lineId: after
  - action: assert
    type: js
    global: __vtCheckpoint.textById.dice-value
    value: DICE 13
  - action: assert
    type: js
    global: __vtCheckpoint.textById.weather-value
    value: WEATHER storm
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 3
  - action: click
    x: 295
    "y": 475
  - action: wait
    ms: 180
  - action: customEvent
