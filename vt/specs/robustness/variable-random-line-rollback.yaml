  - action: screenshot
  - action: click
    x: 295
    "y": 475
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: main
