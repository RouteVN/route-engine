---
title: Action Shader Filters
description: |
  Background, character, and visual actions should attach inline shader filters
  to their generated Route Graphics root targets. All three colored assets are
  expected to render with the same crimson monochrome treatment.
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
specs:
  - a filter on background applies to the generated background sprite
  - a filter on a character item applies once to its composed container
  - a filter on a visual item applies to the generated visual element
steps:
  - action: wait
    ms: 100
  - action: screenshot
---
screen:
  width: 960
  height: 540
  backgroundColor: "#000000"
resources:
  images:
    forest:
      fileId: dmni32
      width: 1920
      height: 1080
    character:
      fileId: char_sprite_1
      width: 553
      height: 865
    marker:
      fileId: la3lka
      width: 200
      height: 200
  transforms:
    character-left:
      x: 300
      y: 540
      anchorX: 0.5
      anchorY: 1
      scaleX: 0.55
      scaleY: 0.55
      rotation: 0
    marker-right:
      x: 730
      y: 270
      anchorX: 0.5
      anchorY: 0.5
      scaleX: 1
      scaleY: 1
      rotation: 0
story:
  initialSceneId: main
  scenes:
    main:
      name: Main
      initialSectionId: main
      sections:
        main:
          name: Main
          lines:
            - id: filtered-actions
              actions:
                background:
                  resourceId: forest
                  filters:
                    - &monochrome-filter
                      id: crimson-monochrome
                      type: shader
                      source:
                        webgl:
                          fragment: |
                            precision mediump float;

                            in vec2 vTextureCoord;
                            out vec4 finalColor;

                            uniform sampler2D uTexture;

                            void main(void)
                            {
                                vec4 color = texture(uTexture, vTextureCoord);
                                float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                                finalColor = vec4(gray, gray * 0.2, gray * 0.2, color.a);
                            }
                        webgpu:
                          source: |
                            struct GlobalFilterUniforms {
                              uInputSize: vec4<f32>,
                              uInputPixel: vec4<f32>,
                              uInputClamp: vec4<f32>,
                              uOutputFrame: vec4<f32>,
                              uGlobalFrame: vec4<f32>,
                              uOutputTexture: vec4<f32>,
                            };

                            struct ShaderUniforms {
                              uProgress: f32,
                              uTime: f32,
                              uResolution: vec2<f32>,
                            };

                            @group(0) @binding(0) var<uniform> gfu: GlobalFilterUniforms;
                            @group(0) @binding(1) var uTexture: texture_2d<f32>;
                            @group(0) @binding(2) var uSampler: sampler;
                            @group(1) @binding(0) var<uniform> shaderUniforms: ShaderUniforms;

                            struct VSOutput {
                              @builtin(position) position: vec4<f32>,
                              @location(0) uv: vec2<f32>,
                            };

                            @vertex
                            fn mainVertex(@location(0) aPosition: vec2<f32>) -> VSOutput
                            {
                              var position = aPosition * gfu.uOutputFrame.zw + gfu.uOutputFrame.xy;
                              position.x = position.x * (2.0 / gfu.uOutputTexture.x) - 1.0;
                              position.y =
                                position.y * (2.0 * gfu.uOutputTexture.z / gfu.uOutputTexture.y) -
                                gfu.uOutputTexture.z;
                              let uv = aPosition * (gfu.uOutputFrame.zw * gfu.uInputSize.zw);
                              return VSOutput(vec4<f32>(position, 0.0, 1.0), uv);
                            }

                            @fragment
                            fn mainFragment(@location(0) uv: vec2<f32>) -> @location(0) vec4<f32>
                            {
                              let color = textureSample(uTexture, uSampler, uv);
                              let gray = dot(color.rgb, vec3<f32>(0.299, 0.587, 0.114));
                              return vec4<f32>(gray, gray * 0.2, gray * 0.2, color.a);
                            }
                character:
                  items:
                    - id: lead
                      transformId: character-left
                      sprites:
                        - id: body
                          resourceId: character
                      filters:
                        - *monochrome-filter
                visual:
                  items:
                    - id: marker
                      resourceId: marker
                      transformId: marker-right
                      layer: 90
                      filters:
                        - *monochrome-filter
