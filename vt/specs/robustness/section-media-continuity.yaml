---
title: Section Entry Media Continuity
description: A choice transition continues a video background authored by both sections.
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
specs:
  - the choice click enters a destination with the same media
  - the destination first line authors the same video background
  - the decoded playing video element survives the choice click and continues advancing
  - a constant-frame WebM makes capture independent of playback time
steps:
  - action: click
    x: 480
    y: 270
  - action: wait
    ms: 900
  - action: customEvent
    name: vt:checkpoint
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value: { sectionId: source, lineId: choice }
  - action: assert
    type: js
    global: __vtLastRenderState.elements.0.children.1.src
    value: video-continuity
  - action: customEvent
    name: vt:videoCheckpoint
    detail: { label: bg-cg-background-video }
  - action: assert
    type: js
    global: __vtVideoCheckpoint
    value:
      {
        decoded: true,
        playing: true,
        hasProgress: true,
        sameElement: null,
        sameSource: null,
        advanced: null,
      }
  - action: click
    x: 480
    y: 270
  - action: wait
    ms: 350
  - action: customEvent
    name: vt:checkpoint
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value: { sectionId: destination, lineId: destination }
  - action: assert
    type: js
    global: __vtLastRenderState.elements.0.children.1.id
    value: bg-cg-background-video
  - action: assert
    type: js
    global: __vtLastRenderState.elements.0.children.1.src
    value: video-continuity
  - action: customEvent
    name: vt:videoCheckpoint
    detail: { label: bg-cg-background-video }
  - action: assert
    type: js
    global: __vtVideoCheckpoint
    value:
      {
        decoded: true,
        playing: true,
        hasProgress: true,
        sameElement: true,
        sameSource: true,
        advanced: true,
      }
  - action: screenshot
---
screen: { width: 960, height: 540 }
resources:
  variables:
    vtAssetIds: { type: string, scope: context, default: video-continuity }
  videos:
    atmosphere:
      fileId: video-continuity
      width: 960
      height: 540
  colors:
    choice: { hex: "#4D4D4D" }
  controls:
    start:
      elements:
        - id: start
          type: rect
          x: 360
          y: 230
          width: 240
          height: 80
          colorId: choice
          click:
            payload:
              actions:
                nextLine: {}
  layouts:
    choiceLayout:
      elements:
        - id: continue
          type: rect
          x: 360
          y: 230
          width: 240
          height: 80
          colorId: choice
          click:
            payload:
              actions:
                sectionTransition: { sectionId: destination }
story:
  initialSceneId: scene
  scenes:
    scene:
      initialSectionId: source
      sections:
        source:
          lines:
            - id: start
              actions:
                control: { resourceId: start }
            - id: choice
              actions:
                control: {}
                background: { resourceId: atmosphere }
                choice:
                  resourceId: choiceLayout
                  items: [{ id: continue, content: Continue }]
        destination:
          lines:
            - id: destination
              actions:
                background: { resourceId: atmosphere }
