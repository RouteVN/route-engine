---
title: Variable Random Choice Branch
description: >-
  A choice click rolls a number with an updateVariable random operation, and a
  conditional in the same click routes on the rolled number.
specs:
  - the first click draws 17 from the inclusive 1 through 20 range and routes to the high line
  - Back returns to the choice with no new draw
  - the second click draws again, stores 4 and routes to the low line
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: source
      lineId: start
  - action: assert
    type: js
    global: __vtCheckpoint.textById.random-number-display
    value: "Number: 0"
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 0
  - action: screenshot
  - action: click
    x: 480
    "y": 180
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: high
      lineId: high
  - action: assert
    type: js
    global: __vtCheckpoint.textById.random-number-display
    value: "Number: 17"
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 1
  - action: screenshot
  - action: customEvent
    name: vt:engineActions
    detail:
      actions:
        rollbackByOffset:
          offset: -1
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: source
      lineId: start
  - action: assert
    type: js
    global: __vtCheckpoint.textById.random-number-display
    value: "Number: 17"
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 1
  - action: click
    x: 480
    "y": 180
  - action: wait
    ms: 180
  - action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: dialogue-container
  - action: assert
    type: js
    global: __vtCheckpoint.pointer
    value:
      sectionId: low
      lineId: low
  - action: assert
    type: js
    global: __vtCheckpoint.textById.random-number-display
    value: "Number: 4"
  - action: assert
    type: js
    global: __vtRandomCalls
    value: 2
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
resources:
  variables:
    vtRandomUint32Sequence:
      type: string
      scope: context
      default: "16,3"
      readonly: true
    randomNumber:
      type: number
      scope: context
      default: 0
  characters:
    narrator:
      name: Guide
  layouts:
    backgroundLayout:
      elements:
        - id: background
          type: rect
          width: 1920
          height: 1080
          colorId: bg
    dialogueLayout:
      mode: adv
      elements:
        - id: dialogue-box
          type: rect
          x: 120
          y: 760
          width: 1680
          height: 220
          colorId: panel
        - id: dialogue-text
          type: text
          x: 160
          y: 825
          width: 1300
          content: ${dialogue.content[0].text}
          textStyleId: textMain
        - id: random-number-display
          type: text
          x: 1760
          y: 80
          anchorX: 1
          content: "Number: ${variables.randomNumber}"
          textStyleId: textMuted
    choiceLayout:
      elements:
        - id: generate-button
          type: rect
          x: 600
          y: 300
          width: 720
          height: 120
          colorId: button
          click:
            payload:
              actions:
                conditional:
                  branches:
                    - when:
                        gte:
                          - var: variables.randomNumber
                          - 15
                      actions:
                        sectionTransition:
                          sectionId: high
                    - actions:
                        sectionTransition:
                          sectionId: low
                updateVariable:
                  id: rollNumber
                  operations:
                    - variableId: randomNumber
                      op: random
                      distribution:
                        type: integer
                        min: 1
                        max: 20
        - id: generate-label
          type: text
          x: 800
          y: 338
          content: ${choice.items[0].content}
          textStyleId: textMain
  fonts:
    fontDefault:
      fileId: Arial
  colors:
    bg:
      hex: "#000000"
    panel:
      hex: "#4D4D4D"
    button:
      hex: "#737373"
    fg:
      hex: "#FFFFFF"
    fgMuted:
      hex: "#D9D9D9"
  textStyles:
    textMain:
      fontId: fontDefault
      colorId: fg
      fontSize: 36
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
    textMuted:
      fontId: fontDefault
      colorId: fgMuted
      fontSize: 34
      fontWeight: "400"
      fontStyle: normal
      lineHeight: 1.2
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: source
      sections:
        source:
          lines:
            - id: start
              actions:
                background:
                  resourceId: backgroundLayout
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Generate an integer from 1 through 20."
                  characterId: narrator
                choice:
                  resourceId: choiceLayout
                  items:
                    - id: generate
                      content: "Generate 1–20"
        high:
          lines:
            - id: high
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "High roll: the lock opens."
                  characterId: narrator
        low:
          lines:
            - id: low
              actions:
                choice: {}
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "Low roll: the lock holds."
                  characterId: narrator
