story:
  initialSceneId: skipNoClick
  scenes:
    skipNoClick:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: line1
              actions:
                setSkipUnseenText:
                  value: true
                startSkipMode: {}
                background:
                  resourceId: marker1
                dialogue:
                  mode: adv
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: "L1"
            - id: line2
              actions:
                setNextLineConfig:
                  applyMode: singleLine
                  manual:
                    enabled: false
                  auto:
                    enabled: true
                    trigger: fromStart
                    delay: 2000
                background:
                  resourceId: marker2
                dialogue:
                  content:
                    - text: "L2"
            - id: line3
