---
title: Playback Skip Waits For A No-Click Line
description: Skip mode does not pass a line that turns manual advance off and sets its own 2000ms auto-advance delay. Skip mode stays on during that line and keeps skipping once the authored delay has advanced it. Each line moves a white block one lane to the right, and a full-width bar shows that skip mode is on.
specs:
  - skip mode advances the first line after its 80ms interval
  - 1000ms into the no-click line, well past the 80ms skip interval, the block is still in lane 2 and the skip bar is shown
  - after the authored 2000ms delay the line advances, and skip mode passes the next line after 80ms (lane 4, skip bar shown)
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 300
  - action: customEvent
    name: vt:tickPlayback
    detail:
      deltaMS: 80
  - action: wait
    ms: 300
  - action: customEvent
    name: vt:tickPlayback
    detail:
      deltaMS: 1000
  - action: wait
    ms: 100
  - action: screenshot
  - action: customEvent
    name: vt:tickPlayback
    detail:
      deltaMS: 1000
  - action: wait
    ms: 300
  - action: customEvent
    name: vt:tickPlayback
    detail:
      deltaMS: 80
  - action: wait
    ms: 300
  - action: screenshot
---
