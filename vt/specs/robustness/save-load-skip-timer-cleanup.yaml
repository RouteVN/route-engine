---
title: Save Load Skip Timer Cleanup
description: Loading a slot while skip is active restores the saved line and cancels the stale skip callback.
specs:
  - save line one after its initial render settles
  - advance to line two and start skip mode
  - load before the 80 ms skip callback fires
  - waiting past the old deadline must leave the restored line active
skipInitialScreenshot: true
viewport:
  id: capture
  width: 1280
  height: 720
steps:
  - action: wait
    ms: 250
  - action: click
    x: 180
    y: 350
  - action: wait
    ms: 250
  - action: click
    x: 470
    y: 350
  - action: wait
    ms: 150
  - action: click
    x: 760
    y: 350
  - action: wait
    ms: 20
  - action: click
    x: 1050
    y: 350
  - action: wait
    ms: 250
  - action: screenshot
---
screen:
  width: 1280
  height: 720
resources:
  controls:
    savedControl:
      elements:
        - id: success-panel
          type: rect
          width: 1280
          height: 720
          colorId: success
        - id: title
          type: text
          x: 90
          y: 90
          content: "EXPECTED: restored slot remains active"
          textStyleId: title
        - id: skip-status
          type: text
          x: 90
          y: 175
          content: "skipMode: ${runtime.skipMode}"
          textStyleId: body
        - id: save-button
          type: rect
          x: 60
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                saveSlot:
                  slotId: cleanup
        - id: save-label
          type: text
          x: 140
          y: 330
          content: Save
          textStyleId: body
        - id: next-button
          type: rect
          x: 350
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                nextLine: {}
        - id: next-label
          type: text
          x: 430
          y: 330
          content: Next
          textStyleId: body
        - id: skip-button
          type: rect
          x: 640
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                setSkipUnseenText:
                  value: true
                startSkipMode: {}
        - id: skip-label
          type: text
          x: 715
          y: 330
          content: Skip
          textStyleId: body
        - id: load-button
          type: rect
          x: 930
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                loadSlot:
                  slotId: cleanup
        - id: load-label
          type: text
          x: 1010
          y: 330
          content: Load
          textStyleId: body
    failureControl:
      elements:
        - id: failure-panel
          type: rect
          width: 1280
          height: 720
          colorId: failure
        - id: failure-title
          type: text
          x: 100
          y: 220
          content: "Intermediate line: start skip, then load"
          textStyleId: title
        - id: inherited-skip-button
          type: rect
          x: 640
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                setSkipUnseenText:
                  value: true
                startSkipMode: {}
        - id: inherited-load-button
          type: rect
          x: 930
          y: 290
          width: 240
          height: 120
          colorId: action
          click:
            payload:
              actions:
                loadSlot:
                  slotId: cleanup
  fonts:
    default:
      fileId: Arial
  colors:
    action:
      hex: "#2563EB"
    success:
      hex: "#166534"
    failure:
      hex: "#991B1B"
    text:
      hex: "#FFFFFF"
  textStyles:
    title:
      fontId: default
      colorId: text
      fontSize: 42
      lineHeight: 1.2
    body:
      fontId: default
      colorId: text
      fontSize: 29
      lineHeight: 1.3
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: saved
              actions:
                control:
                  resourceId: savedControl
            - id: mutated
              actions:
                control:
                  resourceId: failureControl
            - id: stale-sentinel
              actions:
                control:
                  resourceId: failureControl
