---
title: Layout Canvas Anchor and Rotation
description: >-
  Layouts without their own size use the project screen (1280x720 here) as their canvas, so
  transform anchors and the rotation pivot are relative to that canvas. Each grayscale box must
  sit centred inside its white frame: the light background box stays at its authored position
  with a bottom-right anchor, the medium resource-layout box is turned 180 degrees about the
  screen centre into the top-right frame, and the dark inline-layout box stays at its authored
  position with a bottom-centre anchor. With content-based sizing, or with the 1920x1080
  fallback instead of the project screen, the boxes land outside their frames.
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - action: wait
    ms: 100
  - action: screenshot
---
