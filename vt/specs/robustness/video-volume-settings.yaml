---
title: Playing Video Volume Settings
description: Real canvas controls independently change music/background and sound/visual volume, then mute and unmute both decoded videos without restarting playback.
specs:
  - schema-valid video resources follow runtime volume without a second attenuation layer
  - default music and sound preferences preserve HTML media volume 0.5
  - live music and sound settings affect their own playing video independently
  - mute-all silences both videos and unmute restores each channel setting
  - actual video elements remain decoded, playing, and advancing throughout
skipInitialScreenshot: true
viewport: { id: capture, width: 960, height: 540 }
steps:
  - action: click
    x: 480
    y: 270
  - action: wait
    ms: 800
  - action: customEvent
    name: vt:videoVolumeCheckpoint
    detail:
      background: bg-cg-background-video
      visual: visual-clip
  - action: assert
    type: js
    global: __vtVideoGeometry
    value:
      background:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
      visual:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
  - action: assert
    type: js
    global: __vtVideoVolumes
    value:
      background:
        {
          volume: 0.5,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: null,
        }
      visual:
        {
          volume: 0.5,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: null,
        }
  - action: click
    x: 135
    y: 420
  - action: wait
    ms: 250
  - action: customEvent
    name: vt:videoVolumeCheckpoint
    detail:
      background: bg-cg-background-video
      visual: visual-clip
  - action: assert
    type: js
    global: __vtVideoGeometry
    value:
      background:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
      visual:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
  - action: assert
    type: js
    global: __vtVideoVolumes
    value:
      background:
        {
          volume: 0.3,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
      visual:
        {
          volume: 0.5,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
  - action: click
    x: 375
    y: 420
  - action: wait
    ms: 250
  - action: customEvent
    name: vt:videoVolumeCheckpoint
    detail:
      background: bg-cg-background-video
      visual: visual-clip
  - action: assert
    type: js
    global: __vtVideoGeometry
    value:
      background:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
      visual:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
  - action: assert
    type: js
    global: __vtVideoVolumes
    value:
      background:
        {
          volume: 0.3,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
      visual:
        {
          volume: 0.4,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
  - action: click
    x: 615
    y: 420
  - action: wait
    ms: 250
  - action: customEvent
    name: vt:videoVolumeCheckpoint
    detail:
      background: bg-cg-background-video
      visual: visual-clip
  - action: assert
    type: js
    global: __vtVideoGeometry
    value:
      background:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
      visual:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
  - action: assert
    type: js
    global: __vtVideoVolumes
    value:
      background:
        {
          volume: 0,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
      visual:
        {
          volume: 0,
          muted: false,
          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
  - action: click
    x: 855
    y: 420
  - action: wait
    ms: 250
  - action: customEvent
    name: vt:videoVolumeCheckpoint
    detail:
      background: bg-cg-background-video
      visual: visual-clip
  - action: assert
    type: js
    global: __vtVideoGeometry
    value:
      background:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
          videoHeight: 90,
        }
      visual:
        {
          width: 400,
          height: 225,
          textureWidth: 160,
          textureHeight: 90,
          sourceWidth: 160,
          sourceHeight: 90,
          videoWidth: 160,
