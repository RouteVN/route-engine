          decoded: true,
          playing: true,
          hasProgress: true,
          continued: true,
        }
  - action: screenshot
---
screen: { width: 960, height: 540 }
resources:
  variables:
    vtWaitForVideoTextures: { type: boolean, scope: context, default: true }
    vtAssetIds:
      {
        type: string,
        scope: context,
        default: "video-volume-background,video-volume-visual",
      }
  videos:
    background: { fileId: video-volume-background, width: 400, height: 225 }
    clip: { fileId: video-volume-visual, width: 400, height: 225 }
  transforms:
    background: { x: 40, y: 60, anchorX: 0, anchorY: 0 }
    visual: { x: 520, y: 60, anchorX: 0, anchorY: 0 }
  colors:
    button: { hex: "#4D4D4D" }
    text: { hex: "#FFFFFF" }
  fonts:
    default: { fileId: Arial }
  textStyles:
    label: { fontId: default, colorId: text, fontSize: 22 }
  controls:
    start:
      elements:
        - id: start
          type: rect
          x: 360
          y: 230
          width: 240
          height: 80
          colorId: button
          click:
            payload:
              actions:
                nextLine: {}
  layouts:
    settings:
      elements:
        - id: music
          type: rect
          x: 40
          y: 370
          width: 190
          height: 100
          colorId: button
          click:
            payload:
              actions:
                setMusicVolume: { value: 30 }
        - id: music-label
          type: text
          x: 62
          y: 405
          content: Music 30
          textStyleId: label
        - id: sound
          type: rect
          x: 280
          y: 370
          width: 190
          height: 100
          colorId: button
          click:
            payload:
              actions:
                setSoundVolume: { value: 40 }
        - id: sound-label
          type: text
          x: 302
          y: 405
          content: Sound 40
          textStyleId: label
        - id: mute
          type: rect
          x: 520
          y: 370
          width: 190
          height: 100
          colorId: button
          click:
            payload:
              actions:
                setMuteAll: { value: true }
        - id: mute-label
          type: text
          x: 542
          y: 405
          content: Mute
          textStyleId: label
        - id: unmute
          type: rect
          x: 760
          y: 370
          width: 190
          height: 100
          colorId: button
          click:
            payload:
              actions:
                setMuteAll: { value: false }
        - id: unmute-label
          type: text
          x: 782
          y: 405
          content: Unmute
          textStyleId: label
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: start
              actions:
                control: { resourceId: start }
            - id: video
              actions:
                background: { resourceId: background, transformId: background }
                visual:
                  items:
                    - id: clip
                      resourceId: clip
                      transformId: visual
                    - id: settings
                      resourceId: settings
                      layer: 90
                      transform: { x: 0, y: 0, anchorX: 0, anchorY: 0 }
                control: {}
