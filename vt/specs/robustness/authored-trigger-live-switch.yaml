---
title: Authored Timer Trigger Live Switch
description: Changing an enabled authored timer from fromComplete to fromStart starts a timer for the active line.
specs:
  - the line starts with an enabled 5000 ms fromComplete timer
  - switch the active configuration to a 200 ms fromStart timer
  - the active line must advance after the replacement delay
  - the current reconciliation bug keeps the old timer and remains red
skipInitialScreenshot: true
viewport:
  id: capture
  width: 1280
  height: 720
steps:
  - action: wait
    ms: 250
  - action: click
    x: 640
    y: 330
  - action: wait
    ms: 350
  - action: screenshot
---
screen:
  width: 1280
  height: 720
resources:
  controls:
    sourceControl:
      elements:
        - id: failure-panel
          type: rect
          width: 1280
          height: 720
          colorId: failure
        - id: title
          type: text
          x: 110
          y: 100
          content: "BUG: switched fromStart timer did not begin"
          textStyleId: title
        - id: start-button
          type: rect
          x: 420
          y: 260
          width: 440
          height: 140
          colorId: action
          click:
            payload:
              actions:
                setNextLineConfig:
                  auto:
                    enabled: true
                    trigger: fromStart
                    delay: 200
        - id: start-label
          type: text
          x: 485
          y: 308
          content: "Switch to 200 ms fromStart"
          textStyleId: body
    expectedControl:
      elements:
        - id: success-panel
          type: rect
          width: 1280
          height: 720
          colorId: success
        - id: expected-title
          type: text
          x: 120
          y: 220
          content: "EXPECTED: the new fromStart timer advanced"
          textStyleId: title
  fonts:
    default:
      fileId: Arial
  colors:
    action:
      hex: "#2563EB"
    success:
      hex: "#166534"
    failure:
      hex: "#991B1B"
    text:
      hex: "#FFFFFF"
  textStyles:
    title:
      fontId: default
      colorId: text
      fontSize: 42
      lineHeight: 1.2
    body:
      fontId: default
      colorId: text
      fontSize: 28
      lineHeight: 1.3
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: source
              actions:
                setNextLineConfig:
                  auto:
                    enabled: true
                    trigger: fromComplete
                    delay: 5000
                control:
                  resourceId: sourceControl
            - id: expected
              actions:
                control:
                  resourceId: expectedControl
