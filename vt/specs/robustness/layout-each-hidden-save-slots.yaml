---
title: Layout Each Hidden Save Slots
description: >-
  A save overlay whose repeated slot row has a false $when draws its other
  elements, stays clickable, and draws every slot once the condition is true.
specs:
  - the save overlay draws its title and buttons while every slot row is hidden
  - the overlay's Show Slots button works while the slots are hidden
  - all three slot rows are drawn once the condition is true
skipInitialScreenshot: true
viewport:
  id: capture
  width: 960
  height: 540
steps:
  - &wait
    action: wait
    ms: 250
  - action: click
    x: 180
    "y": 470
  - *wait
  - &checkpoint
    action: customEvent
    name: vt:checkpoint
    detail:
      layoutRootId: overlayStack-0
  - action: assert
    type: js
    global: __vtCheckpoint.textById
    value:
      save-title: Save / Load
      show-slots-label: Show Slots
      close-label: Close
  - &screenshot
    action: screenshot
  - action: click
    x: 760
    "y": 55
  - *wait
  - *checkpoint
  - action: assert
    type: js
    global: __vtCheckpoint.textById
    value:
      save-title: Save / Load
      show-slots-label: Show Slots
      slot-label-1: Slot 1
      slot-label-2: Slot 2
      slot-label-3: Slot 3
      close-label: Close
  - *screenshot
---
screen:
  width: 960
  height: 540
resources:
  variables:
    showSlots:
      type: boolean
      scope: context
      default: false
  fonts:
    default:
      fileId: Arial
  colors:
    foreground:
      hex: "#FFFFFF"
    background:
      hex: "#000000"
    panel:
      hex: "#1F2937"
    button:
      hex: "#4D4D4D"
    slot:
      hex: "#166534"
  textStyles:
    body:
      fontId: default
      colorId: foreground
      fontSize: 32
  layouts:
    dialogueLayout:
      elements:
        - id: dialogue
          type: text
          x: 90
          "y": 190
          content: ${dialogue.content[0].text}
          textStyleId: body
          width: 800
    saveGrid:
      paginationSize: 3
      elements:
        - id: save-background
          type: rect
          x: 0
          "y": 0
          width: 960
          height: 540
          colorId: panel
        - id: save-title
          type: text
          x: 90
          "y": 40
          content: Save / Load
          textStyleId: body
        - id: show-slots
          type: rect
          x: 620
          "y": 25
          width: 280
          height: 60
          colorId: button
          click:
            payload:
              actions:
                updateVariable:
                  id: showSlots
                  operations:
                    - variableId: showSlots
                      op: set
                      value: true
        - id: show-slots-label
          type: text
          x: 640
          "y": 37
          content: Show Slots
          textStyleId: body
        - id: slot-rows
          type: container
          x: 90
          "y": 120
          direction: vertical
          gapY: 20
          children:
            - $each: slot, i in saveSlots
              $when: variables.showSlots == true
              id: slot-row-${slot.slotId}
              type: container
              x: 0
              "y": 0
              children:
                - id: slot-background-${slot.slotId}
                  type: rect
                  x: 0
                  "y": 0
                  width: 500
                  height: 70
                  colorId: slot
                - id: slot-label-${slot.slotId}
                  type: text
                  x: 20
                  "y": 15
                  content: Slot ${slot.slotId}
                  textStyleId: body
        - id: close
          type: rect
          x: 710
          "y": 440
          width: 180
          height: 60
          colorId: button
          click:
            payload:
              actions:
                popOverlay: {}
        - id: close-label
          type: text
          x: 730
          "y": 452
          content: Close
          textStyleId: body
  controls:
    navigation:
      elements:
        - id: saves
          type: rect
          x: 70
          "y": 440
          width: 220
          height: 60
          colorId: button
          click:
            payload:
              actions:
                pushOverlay:
                  resourceId: saveGrid
                  resourceType: layout
        - id: saves-label
          type: text
          x: 90
          "y": 452
          content: Save / Load
          textStyleId: body
story:
  initialSceneId: main
  scenes:
    main:
      initialSectionId: main
      sections:
        main:
          lines:
            - id: start
              actions:
                control:
                  resourceId: navigation
                dialogue:
                  ui:
                    resourceId: dialogueLayout
                  content:
                    - text: Open the save menu.
