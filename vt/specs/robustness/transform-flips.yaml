---
title: Transform flip axes
description: |
  flipX and flipY should mirror the resolved scale for transform-backed and
  inline-transform elements.

  - the first screenshot shows the normal background card, character, and logo
  - the second screenshot vertically flips the background, horizontally flips
    the character, and flips the inline visual on both axes
skipInitialScreenshot: true
steps:
  - action: screenshot
  - action: customEvent
    name: vt:nextLine
  - action: screenshot
---
screen:
  width: 1920
  height: 1080
  backgroundColor: "#000000"
resources:
  images:
    background-card:
      fileId: dmni32
      width: 640
      height: 360
    character-sprite:
      fileId: char_sprite_1
      width: 553
      height: 865
    logo:
      fileId: 94lkj289
      width: 1111
      height: 200
  transforms:
    background-normal:
      x: 360
      y: 220
      anchorX: 0.5
      anchorY: 0.5
      scaleX: 1
      scaleY: 1
    background-flipped:
      x: 360
      y: 220
      anchorX: 0.5
      anchorY: 0.5
      scaleX: 1
      scaleY: 1
      flipY: true
    character-normal:
      x: 680
      y: 1080
      anchorX: 0.5
      anchorY: 1
      scaleX: 0.65
      scaleY: 0.65
    character-flipped:
      x: 680
      y: 1080
      anchorX: 0.5
      anchorY: 1
      scaleX: 0.65
      scaleY: 0.65
      flipX: true
story:
  initialSceneId: transformFlipScene
  scenes:
    transformFlipScene:
      name: Transform Flip Scene
      initialSectionId: main
      sections:
        main:
          lines:
            - id: normalTransforms
              actions:
                background:
                  resourceId: background-card
                  transformId: background-normal
                character:
                  items:
                    - id: lead
                      transformId: character-normal
                      sprites:
                        - id: body
                          resourceId: character-sprite
                visual:
                  items:
                    - id: logo
                      resourceId: logo
                      transform:
                        x: 1370
                        y: 260
                        anchorX: 0.5
                        anchorY: 0.5
                        scaleX: 0.45
                        scaleY: 0.45
                      layer: 90
            - id: flippedTransforms
              actions:
                background:
                  transformId: background-flipped
                character:
                  items:
                    - id: lead
                      transformId: character-flipped
                      sprites:
                        - id: body
                          resourceId: character-sprite
                visual:
                  items:
                    - id: logo
                      transform:
                        flipX: true
                        flipY: true
