---
title: Audio Effects Transition On Kept Music
description: A transition audio effect on a line that keeps the same BGM playing plays no transition, on the next line and after a section transition.
skipInitialScreenshot: true
specs:
  - a user gesture starts one BGM sound without an effect
  - the next line keeps the sound with a transition and takes its final mix without an effect
  - a section transition into a line that keeps the sound does the same
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 70
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.src
    value: 3ka3s
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 100
  - action: assert
    type: js
    global: __vtLastAudioEffect
    value: null
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.src
    value: 3ka3s
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 50
  - action: assert
    type: js
    global: __vtLastAudioEffect
    value: null
  - action: assert
    type: js
    global: __vtAudioEffectOccurrenceCount
    value: 0
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
  audioEffects:
    fade-in:
      type: transition
      next:
        volume:
          initialValue: 0
          keyframes:
            - { value: 100, duration: 800, easing: easeOutSine }
    fade-in-low:
      type: transition
      next:
        volume:
          initialValue: 0
          keyframes:
            - { value: 50, duration: 800, easing: easeOutSine }
  colors:
    advance:
      hex: "#000000"
    kept:
      hex: "#4D4D4D"
    complete:
      hex: "#737373"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    toSection:
      elements:
        - id: to-section
          type: rect
          width: 640
          height: 360
          colorId: kept
          click:
            payload:
              actions:
                sectionTransition:
                  sectionId: section2
    complete:
      elements:
        - id: complete
          type: rect
          width: 640
          height: 360
          colorId: complete
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: silent
              actions:
                control:
                  resourceId: advance
            - id: theme
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 70
                  sounds:
                    - id: main
                      resourceId: theme
            - id: kept
              actions:
                control:
                  resourceId: toSection
                bgm:
                  volume: 70
                  audioEffects:
                    resourceId: fade-in
                  sounds:
                    - id: main
                      resourceId: theme
        section2:
          lines:
            - id: kept-after-section
              actions:
                control:
                  resourceId: complete
                bgm:
                  volume: 70
                  audioEffects:
                    resourceId: fade-in-low
                  sounds:
                    - id: main
                      resourceId: theme
