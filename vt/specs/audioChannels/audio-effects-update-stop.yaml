---
title: Audio Effects Update Stop
description: An update audio effect on a line that stops the music plays as the sound's outgoing track, so an update to volume 0 fades the music out.
skipInitialScreenshot: true
specs:
  - the music plays without an effect
  - stopping it with an update effect does not throw
  - the engine emits one exit track built from the update tween
steps:
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.src
    value: 3ka3s
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.length
    value: 0
  - action: assert
    type: js
    global: __vtLastAudioEffect.targetId
    value: bgm:main
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.exit.keyframes.0.value
    value: 0
  - action: assert
    type: js
    global: __vtAudioEffectOccurrenceCount
    value: 1
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
  audioEffects:
    fade-out:
      type: update
      tween:
        volume:
          keyframes:
            - { value: 0, duration: 800, easing: easeInSine }
  colors:
    advance:
      hex: "#10131A"
    stopped:
      hex: "#421B1B"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    stopped:
      elements:
        - id: stopped
          type: rect
          width: 640
          height: 360
          colorId: stopped
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: theme
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 70
                  sounds:
                    - id: main
                      resourceId: theme
            - id: stop
              actions:
                control:
                  resourceId: stopped
                bgm:
                  audioEffects:
                    resourceId: fade-out
                  sounds: []
