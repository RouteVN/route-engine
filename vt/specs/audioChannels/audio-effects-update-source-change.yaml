---
title: Audio Effects Update Source Change
description: An update audio effect on a line that switches the music plays as the new track's incoming track.
skipInitialScreenshot: true
specs:
  - the first music plays without an effect
  - switching tracks with an update effect does not throw
  - the new track enters with the update tween, and the old one stops
steps:
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastAudioEffect
    value: null
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.src
    value: 39csl
  - action: assert
    type: js
    global: __vtLastAudioEffect.targetId
    value: bgm:main
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.enter.initialValue
    value: 0
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.enter.keyframes.0.value
    value: 70
  - action: assert
    type: js
    global: __vtAudioEffectOccurrenceCount
    value: 1
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
    other:
      fileId: 39csl
  audioEffects:
    fade-up:
      type: update
      tween:
        volume:
          initialValue: 0
          keyframes:
            - { value: 70, duration: 800, easing: easeOutSine }
  colors:
    advance:
      hex: "#10131A"
    switched:
      hex: "#163A2C"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    switched:
      elements:
        - id: switched
          type: rect
          width: 640
          height: 360
          colorId: switched
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: theme
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 70
                  sounds:
                    - id: main
                      resourceId: theme
            - id: switch
              actions:
                control:
                  resourceId: switched
                bgm:
                  volume: 70
                  audioEffects:
                    resourceId: fade-up
                  sounds:
                    - id: main
                      resourceId: other
