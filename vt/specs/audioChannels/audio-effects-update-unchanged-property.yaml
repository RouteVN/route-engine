---
title: Audio Effects Update Unchanged Property
description: A retained BGM update omits a tween whose declared property value does not change.
skipInitialScreenshot: true
specs:
  - a user gesture starts one BGM sound before the retained update
  - the update changes volume while its unchanged pan tween is omitted
  - Route Graphics accepts the resulting audio transition
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.update.keyframes.0.value
    value: 30
  - action: assert
    type: js
    global: __vtAudioEffectOccurrenceCount
    value: 1
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
  audioEffects:
    volume-with-unchanged-pan:
      type: update
      tween:
        volume:
          keyframes:
            - value: 30
              duration: 1000
              easing: linear
        pan:
          keyframes:
            - value: 0
              duration: 1000
              easing: linear
  colors:
    advance:
      hex: "#10131A"
    complete:
      hex: "#163A2C"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    complete:
      elements:
        - id: complete
          type: rect
          width: 640
          height: 360
          colorId: complete
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: silent
              actions:
                control:
                  resourceId: advance
            - id: theme
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 80
                  pan: 0
                  sounds:
                    - id: main
                      resourceId: theme
            - id: retained-update
              actions:
                control:
                  resourceId: complete
                bgm:
                  volume: 30
                  pan: 0
                  audioEffects:
                    resourceId: volume-with-unchanged-pan
                  sounds:
                    - id: main
                      resourceId: theme
