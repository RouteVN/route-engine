---
title: Multi-sound BGM Audio Effect Update
description: Isolated browser fixture for one channel-level update fanned out across two retained BGM sounds without flattening their local mix.
skipInitialScreenshot: true
specs:
  - two BGM sounds start with distinct local volume layers
  - one channel update emits an effect for each retained rendered sound
  - Route Graphics schedules both gain ramps without restarting either source
  - the persistent render keeps the authored local volume ratio
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 2
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 60
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.1.volume
    value: 32
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 100
  - action: assert
    type: js
    global: __vtLastRenderState.audioEffects.length
    value: 2
  - action: assert
    type: js
    global: __vtLastRenderState.audioEffects.0.targetId
    value: bgm:main
  - action: assert
    type: js
    global: __vtLastRenderState.audioEffects.1.targetId
    value: bgm:ambience
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 22.5
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.1.volume
    value: 12
  - action: assert
    type: js
    global: __vtLastRenderState.audioEffects.0.properties.volume.update.keyframes.0.value
    value: 22.5
  - action: assert
    type: js
    global: __vtLastRenderState.audioEffects.1.properties.volume.update.keyframes.0.value
    value: 12
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 2
  - action: assert
    type: js
    global: __vtAudioParamRamps.length
    value: 2
  - action: assert
    type: js
    global: __vtAudioParamRamps.0.value
    value: 0.225
  - action: assert
    type: js
    global: __vtAudioParamRamps.1.value
    value: 0.12
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
    ambience:
      fileId: xk393
      volume: 40
  audioEffects:
    smooth-volume:
      type: update
      tween:
        volume:
          keyframes:
            - value: 30
              duration: 1000
              easing: linear
  colors:
    advance:
      hex: "#10131A"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: silent
              actions:
                control:
                  resourceId: advance
            - id: layered-bgm
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 80
                  sounds:
                    - id: main
                      resourceId: theme
                      volume: 75
                    - id: ambience
                      resourceId: ambience
            - id: channel-update
              actions:
                bgm:
                  volume: 30
                  audioEffects:
                    resourceId: smooth-volume
                  sounds:
                    - id: main
                      resourceId: theme
                      volume: 75
                    - id: ambience
                      resourceId: ambience
