---
title: Sound Boundary Effects
description: Per-sound update presets compile onto the rendered sound instead of top-level lifecycle phases.
skipInitialScreenshot: true
specs:
  - a BGM sound selects reusable update effects for its natural begin and end boundaries
  - Route Engine emits concrete beginEffect and endEffect tracks on the sound node
  - the fade-in to 100 ends at the sound's rendered volume, 75% of 80, not at full volume
  - Route Graphics starts the sound and schedules both boundary gain ramps
  - no top-level audio effect occurrence is created for sound boundaries
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 750
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.beginEffect.volume.keyframes.0.startValue
    value: 0
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 60
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.beginEffect.volume.keyframes.0.value
    value: 60
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.endEffect.volume.keyframes.0.value
    value: 0
  - action: assert
    type: js
    global: __vtLastAudioEffect
    value: null
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtAudioParamRamps.length
    value: 2
  - action: assert
    type: js
    global: __vtAudioParamRamps.0.value
    value: 0.6
  - action: assert
    type: js
    global: __vtAudioParamRamps.1.value
    value: 0
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 39csl
  audioEffects:
    fade-in:
      type: update
      tween:
        volume:
          keyframes:
            - startValue: 0
              value: 100
              duration: 300
    fade-out:
      type: update
      tween:
        volume:
          keyframes:
            - value: 0
              duration: 500
  colors:
    advance:
      hex: "#10131A"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: ready
              actions:
                control:
                  resourceId: advance
            - id: playing
              actions:
                bgm:
                  loop: true
                  volume: 75
                  sounds:
                    - id: main
                      resourceId: theme
                      loop: false
                      volume: 80
                      beginEffect:
                        resourceId: fade-in
                      endEffect:
                        resourceId: fade-out
