---
title: Legacy BGM Playback Identity
description: Volume changes across legacy, converted-default, and canonical BGM retain the actual playing audio source.
skipInitialScreenshot: true
specs:
  - a canvas click starts legacy BGM through a real audio user gesture
  - legacy, converted-default, and canonical volume changes reuse the source
  - an update effect targets the converted clip without restarting playback
  - an explicit new clip ID and a stop followed by replay still start new sources
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 100
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.id
    value: bgm:theme
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 35
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtLastAudioEffect.targetId
    value: bgm:theme
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.update.keyframes.0.value
    value: 20
  - action: wait
    ms: 300
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 2
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtLastRenderState.audio
    value: []
  - action: click
    x: 320
    y: 180
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 3
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
  audioEffects:
    quieter:
      type: update
      tween:
        volume:
          keyframes:
            - { value: 50, duration: 250 }
  colors:
    canvas:
      hex: "#10131A"
  controls:
    advance:
      elements:
        - id: advance-surface
          type: rect
          width: 640
          height: 360
          colorId: canvas
          click:
            payload:
              actions:
                nextLine: {}
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: silent
              actions:
                control: { resourceId: advance }
            - id: legacy
              actions:
                control: { resourceId: advance }
                bgm: { resourceId: theme, volume: 80 }
            - id: converted-volume
              actions:
                control: { resourceId: advance }
                bgm:
                  loop: true
                  volume: 60
                  sounds:
                    - { id: default, resourceId: theme, loop: false }
            - id: canonical-volume
              actions:
                control: { resourceId: advance }
                bgm:
                  loop: true
                  volume: 35
                  sounds:
                    - { id: theme, resourceId: theme, loop: false }
            - id: converted-effect
              actions:
                control: { resourceId: advance }
                bgm:
                  loop: true
                  volume: 50
                  sounds:
                    - {
                        id: default,
                        resourceId: theme,
                        loop: false,
                        volume: 40,
                      }
                  audioEffects: { resourceId: quieter }
            - id: legacy-again
              actions:
                control: { resourceId: advance }
                bgm: { resourceId: theme, volume: 60 }
            - id: explicit-restart
              actions:
                control: { resourceId: advance }
                bgm:
                  sounds:
                    - { id: another-occurrence, resourceId: theme }
            - id: stopped
              actions:
                control: { resourceId: advance }
                bgm: { sounds: [] }
            - id: replay
              actions:
                control: { resourceId: advance }
                bgm: { resourceId: theme, volume: 80 }
