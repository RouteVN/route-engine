---
title: Audio Effects Update Normalized Endpoint
description: A decimal BGM endpoint is emitted with the exact value declared by the rendered sound.
skipInitialScreenshot: true
specs:
  - a user gesture starts one BGM sound before the retained update
  - the decimal endpoint passes through the BGM volume mix
  - Route Graphics accepts the exactly aligned terminal keyframe
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 250
  - action: assert
    type: js
    global: __vtLastAudioEffect.properties.volume.update.keyframes.0.value
    value: 0.007000000000000001
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.volume
    value: 0.007000000000000001
  - action: assert
    type: js
    global: __vtAudioEffectOccurrenceCount
    value: 1
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 3ka3s
  audioEffects:
    precise-volume:
      type: update
      tween:
        volume:
          keyframes:
            - value: 0.007
              duration: 1000
              easing: linear
  colors:
    advance:
      hex: "#10131A"
    complete:
      hex: "#163A2C"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    complete:
      elements:
        - id: complete
          type: rect
          width: 640
          height: 360
          colorId: complete
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: silent
              actions:
                control:
                  resourceId: advance
            - id: theme
              actions:
                control:
                  resourceId: advance
                bgm:
                  volume: 80
                  sounds:
                    - id: main
                      resourceId: theme
            - id: retained-update
              actions:
                control:
                  resourceId: complete
                bgm:
                  volume: 0.007
                  audioEffects:
                    resourceId: precise-volume
                  sounds:
                    - id: main
                      resourceId: theme
