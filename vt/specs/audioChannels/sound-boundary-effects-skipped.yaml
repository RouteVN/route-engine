---
title: Mid-Effect Sound Boundary Skip
description: Enabling transition skipping settles active per-sound boundary automation through the renderer path.
skipInitialScreenshot: true
specs:
  - the sound starts a long beginEffect before transition skipping is enabled
  - Route Engine removes the boundary effect from the retained sound node
  - Route Graphics cancels the active ramp and settles the gain to its authored value
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 200
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.beginEffect.volume.keyframes.0.value
    value: 100
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtAudioParamRamps.length
    value: 1
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 100
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtAudioParamRamps.length
    value: 1
  - action: assert
    type: js
    global: __vtAudioBoundarySettlementCancelCount
    value: 1
  - action: assert
    type: js
    global: __vtLastAudioBoundarySettlementValue
    value: 1
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 39csl
  audioEffects:
    fade-in:
      type: update
      tween:
        volume:
          keyframes:
            - startValue: 0
              value: 100
              duration: 2000
  colors:
    advance:
      hex: "#10131A"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
    skip:
      elements:
        - id: skip
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                setSkipTransitionsAndAnimations:
                  value: true
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: ready
              actions:
                control:
                  resourceId: advance
            - id: playing
              actions:
                control:
                  resourceId: skip
                bgm:
                  sounds:
                    - id: main
                      resourceId: theme
                      beginEffect:
                        resourceId: fade-in
