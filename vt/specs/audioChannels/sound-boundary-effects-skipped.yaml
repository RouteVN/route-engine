---
title: Skipped Sound Boundary Effects
description: The settled transition-skip preference omits per-sound boundary automation from the renderer path.
skipInitialScreenshot: true
specs:
  - the destination enables transition skipping in the same action batch that starts the sound
  - Route Engine omits beginEffect and endEffect from the settled sound node
  - Route Graphics starts the sound without scheduling either boundary gain ramp
steps:
  - action: click
    x: 320
    y: 180
  - action: wait
    ms: 200
  - action: assert
    type: js
    global: __vtLastRenderState.audio.0.children.0.src
    value: 39csl
  - action: assert
    type: js
    global: __vtAudioSourceStartCount
    value: 1
  - action: assert
    type: js
    global: __vtAudioParamRamps.length
    value: 0
---
screen:
  width: 640
  height: 360
resources:
  sounds:
    theme:
      fileId: 39csl
  audioEffects:
    fade-in:
      type: update
      tween:
        volume:
          keyframes:
            - startValue: 0
              value: 100
              duration: 300
    fade-out:
      type: update
      tween:
        volume:
          keyframes:
            - value: 0
              duration: 500
  colors:
    advance:
      hex: "#10131A"
  controls:
    advance:
      elements:
        - id: advance
          type: rect
          width: 640
          height: 360
          colorId: advance
          click:
            payload:
              actions:
                nextLine: {}
story:
  initialSceneId: scene1
  scenes:
    scene1:
      initialSectionId: section1
      sections:
        section1:
          lines:
            - id: ready
              actions:
                control:
                  resourceId: advance
            - id: skipped
              actions:
                bgm:
                  sounds:
                    - id: main
                      resourceId: theme
                      beginEffect:
                        resourceId: fade-in
                      endEffect:
                        resourceId: fade-out
                setSkipTransitionsAndAnimations:
                  value: true
